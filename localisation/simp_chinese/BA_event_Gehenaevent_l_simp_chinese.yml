l_simp_chinese:
 BA_Gehena_Event.0001.name:0 "稳固今日之发展"
 BA_Gehena_Event.0001.desc:0 "    在将有限的资源分配给治理旧领土或开拓新领土的抉择上，格赫娜内部最终风纪委的方案能让更多人接受。万魔殿方面对此有所不满，毕竟这打乱了她们对外扩张的计划，不过将有限的资源分配给目前现有的首都和殖民地毕竟还是利在千秋的。"
 BA_Gehena_Event.0001.a:0 "日奈的威望提升了。"

 BA_Gehena_Event.0002.name:0 "将基沃托斯古迹中的缺损合金用于国内的稳定工作"
 BA_Gehena_Event.0002.desc:0 "    不久前从古迹中挖出来的缺损合金至今还没有什么用处，万魔殿和风纪委也因这些合金的最终用途吵得不可开交。特别是对用于军事方面的那一部分争得火热。在没日没夜的辩论和争吵下，代表风纪委的方案——《行星轨道风纪工程》最终被敲定。这个方案将用这些缺损合金去制作能联动地面维和部队进行行动的天基治安站。"
 BA_Gehena_Event.0002.a:0 "日奈的威望提升了。"

 BA_Gehena_Event.0003.name:0 "陪同日奈的策划"
 BA_Gehena_Event.0003.desc:0 "    夜半，基沃托斯无比寂静，即便是格赫娜学园丽仍有一些小打小闹的嘈杂声，没过多久声音消失，基沃托斯再次回归安宁。\n    这一切的功劳得源于日奈在格赫娜内部会议中对于行星轨道风纪工程的据理力争，以至夜晚的基沃托斯不在危机四伏。\n    风纪委办公室此刻亮起了灯光，日奈少见的在里头查阅文件，似乎琢磨着什么事。\n    作为基沃托斯的老师，因治安改善后就此也很放肆的大半夜来格赫娜学院里头逛街，碰巧通过窗户看见了日奈在办公的一幕\n    走到门口，咚咚咚敲门进去时候，日奈只是漠然的抬起头，而当确认来者的身份后，这一份漠然迅速转变为震惊，喜悦，最后是几分无奈。\n    非常自觉地在对方的对面坐下，看着对方手里一份又一份的计划案，不禁发问：“日奈，这么晚了，很辛苦呢……”\n    “嗯......”日奈并不喜欢让别人看到她软弱的一面，除非是，现在这样……\n    无需多言，我只是静静地陪伴在她身旁，倾听她的想法与计划，然后，帮她文件全部整理一遍，直到清晨来临。\n    我将外套脱下，披在日奈盖在睡倒在案桌上的日奈身上，轻手轻脚的离开了风纪委办公室。"
 BA_Gehena_Event.0003.a:0 "“今天也辛苦了啊，日奈酱……”"

 BA_Gehena_Event.0004.name:0 "着重于对内的发展"
 BA_Gehena_Event.0004.desc:0 "    基沃托斯目前的产出还不足以在各个领域上支出足够的经费，对于侧重的发展方向风纪委和万魔殿两派的内政部员再一次争吵了起来。着重于内部的稳定还是对新殖民地的开发，会议上吵得难舍难分。在两边的内政部员轮番阐述和辩论下，以及核心部员私底下的承认与妥协，最后通过了风纪委的对内巩固法案，以提升目前现有城市的运转速度和治安稳定。"
 BA_Gehena_Event.0004.a:0 "“日奈的威望提升了。”"

 BA_Gehena_Event.0005.name:0 "对话语权的矛盾"
 BA_Gehena_Event.0005.desc:0 "    深夜，在格黑娜学院的大道上，我少见地接到日奈的主动邀请，去风纪委的办公室见见她。\n    门在被我敲响之后听到了里面传来带着几分疲惫的“请进”，经历过那一晚的事情之后，日奈早就不烦恼于把自己脆弱的那一面暴露在我面前。像往常一样坐在她对面，在片刻的沉默之后，她说出了找我过来的目的。\n    “老师，你觉得学院内部的最终话语权真的很重要吗？”\n    “重要，其实，也不重要。”\n    “那……老师觉得，我有能力成为那个排板决定一切的人吗？”\n    “能不能成为，反而是不重要的哦，日奈，正如我刚才所说……”\n    “对一个团体来说，最重要的不是拍板的那个人，而是能给予拍板的人合理的方案的人，不是吗？争夺话语权是一方面，在争夺话语权的过程中，应该更多的去想有了最终话语权之后，属于你的格赫娜内阁能不能为办好每一件不需要你亲力亲为的事。而这个问题的答案，作为目前的学生会长的日奈，比我更清楚哦？”\n    “这.....”\n    “我知道你的意思，不必如此纠结整合大会的结果，日奈，你的身边已经有很多值得你信任的人了哦？”\n    “嗯……”\n    “去休息吧，我陪你，别着凉了……”像往常一样，我把大衣披在她身上。"
 BA_Gehena_Event.0005.a:0 "（可以信任的人，也包括老师在内啊……）日奈在心里这么想着。"

 BA_Gehena_Event.0006.name:0 "话语权的前夕"
 BA_Gehena_Event.0006.desc:0 "    历经十余年的讨论后，话语权的最终归属已经基本确定，万魔殿和风纪委两边的内政部员已经各自讨论最后的打算，当下最忧愁的应该就是分属于两边的伊吕波和日奈了。"
 BA_Gehena_Event.0006.a:0 "基沃托斯的未来在此决定。"

 BA_Gehena_Event.0007.name:0 "与日奈的交流"
 BA_Gehena_Event.0007.desc:0 "    久违地，日奈约我到废校舍见面，尽管这里已经经过翻修，但是日奈还是保留了其中的一块区域，她似乎非常喜欢这里。\n    刚走进就校舍，便听到一阵钢琴声传来，动听怡人。走到琴声传来的屋子，之间日奈饶有享受的弹着钢琴。\n    随着一个插入式的收尾，她站起身来，面向我的方向。\n    “总感觉以后没这样的机会了。”她的声音带着几分感慨。\n    “以后会很忙吗？”\n    “嗯，虽然那边还在吵，但不出意料的话风纪委应该是拿下话语权了。以后的大小事估计全都得我负责了吧，总感觉万魔殿那边在这次之后不会给我们更多的帮忙。”\n    “你不去问怎么知道不会帮忙呢？日奈，万魔殿的首脑看似是真琴同学，实际上做谋划的仍然是现在还在内阁中工作的伊吕波同学。如何去规划当你正式成为基沃托斯的总领导人后，你要想的是如何去安排手下的人工作”\n    “当然，这不是一蹴而就的事，多花点时间想想吧，就像我之前说的那样，如果每件事都需要自己亲力亲为的话，你总有一点会累倒的……”\n    “嗯……”\n    “嘛，不过现在并不着急，都来到这了，让我多听听你的琴声吧。”见到她略带几分沉思的脸色，我决定把话题岔开。\n    在收到邀请之后，日奈决定将这些烦恼事暂时放在脑后。"
 BA_Gehena_Event.0007.a:0 "琴声久久飘荡在房间里。"

 BA_Gehena_Event.0008.name:0 "风纪委的通告"
 BA_Gehena_Event.0008.desc:0 "    格赫娜学院内部经过多方协调后，最终确定由日奈出任联邦学生会长一职，风纪委一方的内政部员纷纷欢呼雀跃，而万魔殿那边的内政部员也没有想象中的沮丧。"
 BA_Gehena_Event.0008.a:0 "尘埃落定。"

 BA_Gehena_Event.0009.name:0 "将一部分政府结构让渡回万魔殿"
 BA_Gehena_Event.0009.desc:0 "    “即便我真正走到了联邦学生会长这一步，我并没有信心去依靠自己一个人的势力管好我们基沃托斯。”日奈通过基沃托斯中枢广播说到。\n    “在本次格赫娜内部的多方协调中，我代表风纪委一方有幸见识到了万魔殿不乏内政能力出众的学生。她们的领导者伊吕波同学更是受我深深的佩服。至此，我决定将一部分对外军事扩张和相关军工让渡给万魔殿，让她们以自己独特的想法，去为我们基沃托斯带来星系之外的神秘礼物。”\n    这时，伊吕波走到了日奈的身旁，日奈非常敬意的走到了一边，将主台让给了伊吕波。伊吕波只是于日奈相视一笑，便接着属于自己的发言：\n    “咳咳，这里是伊吕波。联邦学生会长日奈同学已经把安排说的差不多了。那我，枣伊吕波会带领万魔殿的内政部员，去为日奈会长治下的基沃托斯贡献一份属于我们的自己一份力。”\n    之后，伊吕波扯了扯日奈的衣角递了个眼神，日奈心领神会，两人靠近一起对着麦克风喊到。\n    “我们，必将闪耀于星海！”"
 BA_Gehena_Event.0009.a:0 "权力争夺战的风波就此平息。"

 BA_Gehena_Event.0010.name:0 "落幕后的惆怅"
 BA_Gehena_Event.0010.desc:0 "    话语权事件终于落幕，而日奈在正式上任的那一刻，需要自己亲力亲为的事情更多了。即便是有了伊吕波和他的内政部员打下手，自己风纪委的内政部员却明显的表现出有些力不从心的样子。身边平时仅有帮自己处理数据的亚子同学也在自己正式上任的一刻前往更重要的行星构建部整理首都和殖民地大大小小的资料了，而伊织与千夏正忙着带领风纪委的风纪部队去管理星域治安。\n    如此庞大的政治机器短时间内需要日奈一个人各种亲力亲为了。"
 BA_Gehena_Event.0010.a:0 "然而，少女身上的重担仍未卸下。"

 BA_Gehena_Event.0011.name:0 "对政府职员的零容忍政策"
 BA_Gehena_Event.0011.desc:0 "    基沃托斯自步入星海之前，政府机构内已然出现的腐败迹象。随着工业化建设和科技研究，步入星海时代之后这帮腐败分子所贪污的款项越来越多。\n    日奈还只是临时学生会长时并没有将重心放在处理政府机构内的蛀虫上，现在正式成为学生会长之后，日奈终于有绝对的手腕去处理政府里的蛀虫了。\n    经过了很长一段的深根挖掘下，基沃托斯大大小小的机构内部的坏根被一一除掉，姑且来说腐败问题基本明面上看不见了。但大量的政府官员离岗将会导致在岗职员公务压力加大，这也导致日奈薄如一张纸的内政班底雪上加霜。\n    或许当初日奈没有将伊吕波纳入内阁团队的话，这一顿操作可能会让日奈彻底忙不过来了。"
 BA_Gehena_Event.0011.a:0 "局势仍未明朗。"

 BA_Gehena_Event.0012.name:0 "睡不着的少女"
 BA_Gehena_Event.0012.desc:0 "    日奈久违的回到自己的家中，这些天她基本都是一个人吃喝拉塞在学生会长办公室，相比于现在的工作压力。自己还只是个风纪委委员长时的工作压力根本不算什么。\n    “哎……”\n    日奈愁苦的打开手机，完全丧失了几乎所有欲望。整个人还弥留在工作压力之中完全没有脱离。日奈自己也不想再这样下去，但她无法凭借自己一个人走出目前的困境。天色已晚，日奈最后还是抱着侥幸心理发出去了一条短信：\n    “老师......你能来我这一趟嘛......来我的卧室”\n    日奈似乎根本没抱过什么期待，发出去短信后就把手机甩在一边，但仅过去几秒手机便有了动静。\n    日奈紧张却又兴奋的抓起手机看看动静，猛然一条短信让日奈的空洞的眼神里散发出了一丝的光明：\n    “嗯，等我一会，马上到。”"
 BA_Gehena_Event.0012.a:0 "作为老师，我又怎么会拒绝我可爱的学生呢？"

 BA_Gehena_Event.0013.name:0 "屋檐下的安慰"
 BA_Gehena_Event.0013.desc:0 "    自日奈成为正式的学生会长的那一刻，我便一直在注视着日奈的行动。连续几年下来忙碌的工作，以及自己游走在各界的调和，都能清楚地感觉到整个基沃托斯稳中向好，日奈却一个人负重前行。\n    很早之前，在给日奈的联系人设置上，就提前弄好了“特别关心”选项，因为自己非常清楚，日奈终有一天将会撑不住，向自己寻求帮助。\n    平时要强的她不会轻易接受自己的帮助，也只有到那时，自己说的话她或许能够完全的听进去。\n    这一天终究是到了。自己根本顾不了在夏莱的事务，穿身便装就下楼发动时刻待命的空中电能车开过去。\n    手里紧紧的握住数年之前日奈留给自己的屋子钥匙，自己也从未真正的去过几次......等到了日奈家的楼下，电梯猛按房门号也不见得多块，攧手攧脚的钥匙都差点抓不稳，走到日奈的房门前才稍微平息了自己内心的慌张。\n    咔嚓，房门被打开了，穿着睡袍的少女嚎啕大哭的扑进了sensei的怀里。这一刻，似乎只有哭泣，才能够彻底宣泄出她所有的情感。\n    “我们……进去慢慢哭……好不好？”\n    浅浅的抚摸着日奈的额头，这熟悉而又陌生的手感……哭声些许停下了，也好一个公主抱将日奈抱进屋里，再把门带上，为了日奈，也为了夜晚的其他人。\n    陪同日奈在屋里哭了好一阵子，日奈心中的压力才逐渐释放完了，而后用那红肿的眼睛可怜兮兮的看着我。\n    “你已经做的非常好了，日奈。”对于对方叫我过来的目的我已了然于胸。\n    “呜……呜……”\n    “我已经在了哦，日奈，今天的夜晚是属于我们两个人的，好好跟我倾诉你心中的压力吧？”\n    夜晚，即将有一个愁眉苦脸的少女离去，而诞生了一个含着泪水有说有笑的少女。时至今日，日奈的那一份话匣子，才逐渐的向sensei敞开……"
 BA_Gehena_Event.0013.a:0 "“不用怕，我会在你身边的，一直都在……”"

 BA_Gehena_Event.0014.name:0 "久违的值班"
 BA_Gehena_Event.0014.desc:0 "    基沃托斯自步入星海时代后就有一个不成文的规定，凡是去夏莱值班的学生，都不能以在夏莱外头的职权为由压制夏莱的sensei，连同学生会长也不例外。\n    但一般来说，职位越高的人越忙碌，抽空之余有时间回到夏莱值班的学生们少之又少，平时见得多的，亦是一些围绕着首都圈工作的学生们，其中就包含学生会长。\n    然而日奈这些年来过于忙碌，始终没有想过去夏莱值班，而直至不久前日奈的映像里，“去夏莱值班等同于求助老师”这个念头深深挥不去。\n    但就在那晚之后，一切都变了。\n    通过夏莱的主控屏，能清晰地看到穿着常服的日奈站在门口等候，日奈左瞟右看，扭扭捏捏的似乎很在意附近的人注意到她。\n    小手按一按门控，门一打开，日奈一个健步就从还未完全打开的自动门门缝钻了进来。“不用这么着急的呀，日奈。”回头看了看那害羞的少女说道。\n    “不是……不是这样的……”日奈通红的小脸蛋完全藏不住内心的想法，惹人恋爱的样子让人完全舍不得欺负一点。\n    “嘛，先坐下吧。其实夏莱这边来值日的学生也没那么频繁，平时都是我一个人在干活。”\n    日奈似乎还没完全适应夏莱的环境，轻手轻脚的走到sensei的身边，只见sensei的主控屏上和桌面上整整齐齐摆满了已经分类好的各个领域资料。\n    “这些是？”\n    “这些都是位于五湖四海的，我可爱的学生们发给我的资料。只要有人能整理好一线资料到我的手中，我所能做的事就只是需要归类再整理和综合拟定计划了。”\n    “诶？”\n    日奈似乎对这种工作方式异常的吃惊。坐在sensei身边靠着他，倾听sensei的连绵话语。桌面上的资料在自己的手里翻阅着，数年来对于基沃托斯的规划自己的心里乃是一清二楚，分散在五湖四海的学生们就像是你的眼线一般，让自己得以窥视整个星海。有的时候觉得，自己可能曾今就是星海的一部分……\n    但摆在自己眼前的，是如何让这位楚楚动人的少女，学会轻松省力的方法处理事务，不需要让自己什么事都亲力亲为。"
 BA_Gehena_Event.0014.a:0 "至此，长达一天的久违的授课，开始了……"

 BA_Gehena_Event.0015.name:0 "从未体验过的一天"
 BA_Gehena_Event.0015.desc:0 "    自那次值班之后，日奈便回去整改了身边的内政部员，扩招了一部分并且尽量的将一些不那么重要的程序性的东西下发给了她们。有那么一刻，日奈终于感觉到自己是放松下来了些许。\n    坐在神圣之塔里头的日奈此刻想的依旧是宇宙的大海。\n    “所以，现在有空走出来看看嘛？”\n    是老师发来的短信。\n    “走出来嘛？走去哪……”日奈一时间迷惑，不知道老师所说的走出来到底是哪里，便以此发了短信回复过去。\n    “当然是神圣之塔的外头。”\n    日奈迟疑的看向房间里的不远处，的确是有一个同向外廊的大门。\n    “莫非……”\n    日奈快步走向大门推开，发现左拐不远处还有一个向上旋转攀升的合金楼梯，日奈沿着合金楼梯飞奔上去，直至终点，一个硕大的平台展现在日奈的眼前。\n    这，就是神圣之塔的最高峰平台……旁边停着一辆空中电能车，不远处还站着一位熟悉的身影。\n    当听到那一声呼唤，便满意的收起了手机，回头看向自己等候多时的少女。\n    “第一次走到这里，不多看看嘛？”\n    “多看看？”日奈下意识的环顾了四周，才发现站在这里，能将基沃托斯的主城区一览无余。\n    “今天工作怎么样？”有意的唐突发问道\n    “诶？今天刚好把新的一批内政部员给提拔安排下去，现在开始能感觉工作量已经少很多了。”\n    “是嘛？你辛苦了，日奈。应该说，欢迎回来，嘛？”\n    “呃？”日奈被sensei说的话搞得有点云里雾里的。"
 BA_Gehena_Event.0015.a:0 "“欢迎回来的意思就是：现在的你，才开始是真正的你了。”"

 BA_Gehena_Event.0016.name:0 "对策收缩于国内"
 BA_Gehena_Event.0016.desc:0 "    在万魔殿负责对外军事扩张成果有限的情况下，日奈选择集中一部分资源服务于国内大大小小的领域。而有限的风纪委部员并不能够将兵力部署的四通八达。\n    借由工程部与时俱进的自动防御炮台开发下，大量用于代替风纪委部员巡逻火力的新自动防御炮台出现了。这些自定防御炮台将成为维护基沃托斯领土内风纪的得力干将，因此所节省的军事力量一方面能反哺于风纪委更优秀的维稳，另一方面也能支撑万魔殿扩张时更有保障的资源补给线。"
 BA_Gehena_Event.0016.a:0 "放手去做吧。"

 BA_Gehena_Event.0017.name:0 "第一次放手"
 BA_Gehena_Event.0017.desc:0 "    在将政治中心收缩于国内后，绝大部分的内政部员负责的都是自己所熟悉的政务了，日奈也因此能够完全的放手，将基本的决策和安排交于部员们自行处理。自己也是头一回坐在学生会长的主控室上，轻松写意的调取各个地区成体系的领域报告。\n    这一切的一切都要都要归功于老师的那一晚安慰，那一天教导，那一次陪伴。"
 BA_Gehena_Event.0017.a:0 "“sensei，感谢您，拯救了我。”"

 BA_Gehena_Event.0018.name:0 "逐渐舒张的真正炽热之心"
 BA_Gehena_Event.0018.desc:0 "    自采用自动防御炮台来负责风纪火力维持之后，日奈格外的关注自动防御炮台的使用。在她的眼里，这种平台的建造能大大降低风纪委部员的火力需求和生存压力，同时为了应付星海之中的丑陋外星人们的敌情，日奈大大为千年工程部投入了自动防御炮台研发的经费。"
 BA_Gehena_Event.0018.a:0 "此刻，日奈内心的某种癖好，正在燃起炽热的火焰。"

 BA_Gehena_Event.0019.name:0 "格赫娜学子们的学园"
 BA_Gehena_Event.0019.desc:0 "    自日奈第一次放手后，格赫娜内部的学生突然掀起了一阵严肃但又欢脱的讨论氛围，有的人在讨论基沃托斯的政务大事，有的人再讨论军工区划的结构小事，有的人再讨论哪里的饭菜好吃，还有的人在思考哪座殖民地有异性天然气温泉挖。\n    日奈紧绷的神经舒张的那一刻，似乎格赫娜整个学院都从枷锁中解放了出来\n    或许，这就是格赫娜吧。"
 BA_Gehena_Event.0019.a:0 "但，这也确实是格赫娜学子们的学园。"




 BA_Gehena_Event.0101.name:0 "开拓于明日之潮流"
 BA_Gehena_Event.0101.desc:0 "    在将有限的资源分配给治理旧领土或开拓新领土的抉择上，格赫娜内部最终是万魔殿的方案更能让人接受，他们主张将政策调整成不计代价的发展，以应对以后开疆拓土或打击外星的人情况。"
 BA_Gehena_Event.0101.a:0 "伊吕波的威望提升了。"

 BA_Gehena_Event.0102.name:0 "将基沃托斯古迹中的缺损合金用于对外扩张"
 BA_Gehena_Event.0102.desc:0 "    不久前从古迹中挖出来的缺损合金至今还没有什么用处，万魔殿和风纪委也因这些合金的最终用途吵得不可开交。特别是对用于军事方面的那一部分争得火热。在没日没夜的辩论和争吵下，代表万魔殿的方案——《快速反应舰队计划》最终被敲定，这批合金将用于快速批量建造目前模板下的护卫舰，以用于应对星际威胁。同时为了配合舰队的生产，国内的所有工业线将抽调一部分用于维持短期计划下的加快护卫舰建造方案。"
 BA_Gehena_Event.0102.a:0 "伊吕波的威望提升了。"

 BA_Gehena_Event.0103.name:0 "倾听伊吕波的担忧"
 BA_Gehena_Event.0103.desc:0 "    伊吕波的摸鱼室，嗯，这么说来，确实有一段时间没有来这里了，自从选举结束以来，这间屋子不知不觉变成了伊吕波的加班室，原本随手可拿的漫画和零食已经不见，取代而之的则是各种各样的打印纸和文件夹。\n      走进房间，已然看见伊吕波趴在废纸堆里不想动弹。面对此景第一个念头便是把伊吕波当毛绒玩具般抱起来陪她一起整理一下屋子。\n    两人整理屋子时有着浑然天成的默契，相互协调下地面上的杂物已基本上归类完毕，剩下的只有将一类类的资料文件夹归档。\n    “呐，老师，你说万魔殿掌握了主要政策的构建真的是一件好事嘛？”伊吕波一边把文件整齐的放在书架上一边询问。\n    “为什么这么想呢？”\n    “虽然万魔殿的法案的确是进过内政部员沟通之下拟出来的，但其本质还是真琴本人的‘野望’，她的字典里可没有平衡二字，哎。”\n    “不过，伊吕波才是最后递交决定的那个人，不是吗？”\n    “格赫娜议会已经不想以往的小打小闹那么简单了，现在格赫娜成为联邦学园的主导者，政策会下达到整个基沃托斯及其附属地。万魔殿内部合适的政见，你就去认可它，不合适的，你就去否认它。你并不是为万魔殿负责，而是为整个基沃托斯负责。相信日奈同学那边也会因为这种转变的不适应头疼吧。”\n    “这.....这样啊......老师好像说了什么超级大的大道理”\n    我不做言语，对于学生们来说，她们需要学习的东西还有很多。看了看书架，顶上能刚好放一些积压存档的文件。\n    “来，我抱你起来吧，把那些不重要的文件放到上面去”\n    “诶？”"
 BA_Gehena_Event.0103.a:0 "（那么，我的存在，又是什么呢？）伊吕波如此想到。"

 BA_Gehena_Event.0104.name:0 "展望于对外的扩张"
 BA_Gehena_Event.0104.desc:0 "    基沃托斯目前的产出还不足以在各个领域上支出足够的经费，对于侧重的发展方向风纪委和万魔殿两派的内政部员再一次争吵了起来。着重于内部的稳定还是对新殖民地的开发，会议上吵得难舍难分。在两边的内政部员轮番阐述和辩论下，以及核心部员私底下的承认与妥协，最后通过了万魔殿的对外扩张法案，以加速目前新殖民地的发展速度。"
 BA_Gehena_Event.0104.a:0 "伊吕波的威望提升了。"

 BA_Gehena_Event.0105.name:0 "对话语权的踌躇"
 BA_Gehena_Event.0105.desc:0 "    晚上，受邀再次来到伊吕波的摸鱼室，现在的摸鱼室除去摆着整整齐齐的文件以外，还多了一些放在伊吕波随手可拿位置上的零食和漫画书，这种熟悉的感觉真好啊。\n    “哟sensei来了~要不先躺一会吧”伊吕波拍了拍身边的空位。\n    毫不避讳的就伊吕波的邀请躺在伊吕波的旁边，和伊吕波四目相对。两人只是互相看着对方，平淡的露出微笑，伊吕波似乎是在享受着这一刻。过了一会，伊吕波才看向天花板，然后缓缓问道\n    “呐，sensei，你说万魔殿掌握了话语权真的是一件好事嘛？”\n    “伊吕波认为呢？”\n    “我觉得吧，真不一定是好事。老师你也是知道的，万魔殿就算因为话语权话语权，学园内的一些事物处理起来对于我们来说基本就是从零开始。并且真琴部长你也知道，哎。”\n    “不要只专注于话语权哦，伊吕波。想想身为内阁总长的你，你身边最需要的是什么班子？”\n    “哦？”伊吕波若有所悟的回答\n    “要想清楚一件事，不是为了拿到话语权而争话语权，而是拿到话语权之后，你该怎么做？”\n    “我只知道首先我会很累，其次……嗯……我想我知道了哦，谢谢老师。”\n    两人一同看着天花板，声控灯也在伊吕波的轻声命令下熄灭，此时此刻两人便在这屋子里堕入梦乡。"
 BA_Gehena_Event.0105.a:0 "少女此刻不再踌躇。"

 BA_Gehena_Event.0106.name:0 "与伊吕波的交流"
 BA_Gehena_Event.0106.desc:0 "    夜晚，伊吕波久违的坐在学院广场的花茎喷泉旁的木椅上，距离上一次坐在这里休息她已经想不起是什么时候了。这个时候的格赫娜学子们基本都散在各地吃饭，这个点还坐在这里休息的伊吕波反而是属于极少数了。\n    “约在这里见面，不像你呀，伊吕波”\n    伊吕波听到熟悉的声音，倍感轻松的深呼吸一口气，我已经坐在她的旁边了\n    “就，久违的看看吧......以后怕是没这么闲心了”\n    “话语权的事，差不多是定下来了。但是风纪委那边非常抗拒真琴部长成为总领导人，不知道该如何是好。”\n    “那就让伊吹同学当总领导人呗。”\n    “诶？”伊吕波吃惊的看向我“这不太好吧......”\n    “再以伊吹上任为由，将一部分执法机构让渡回风纪委，这样她们也乐意去帮你干活了。”\n    “呃……”伊吕波陷入了深沉的思考\n    “到时候我会慢慢的配合你们新政府的改革的，虽然这样子伊吕波你身上的担子还是很重，慢慢来吧”\n    伊吕波看向sensei，深呼吸了一口气，似乎还没有完全认可我的提议，接着伊吕波幽幽的抬头望向天空。\n    “老师，你说这片天空……真的属于我们嘛？”\n    “一定属于我们，而且我们一定能管理的好。”我的话语中带着几分不容置疑。"
 BA_Gehena_Event.0106.a:0 "至此，她决定向前迈出第一步。"

 BA_Gehena_Event.0107.name:0 "万魔殿的通告"
 BA_Gehena_Event.0107.desc:0 "    格赫娜学院内部经过多方协调后，万魔殿最终是取得联邦学生会长这个位置，但最终由谁来担任这件事，万魔殿和风纪委一直吵得不可开交。最后由伊吕波的出面协调下，联邦学生会这个位置最后是由伊吹来当任。这样的结果在众人的诧异中慢慢的接受了。"
 BA_Gehena_Event.0107.a:0 "等等，伊吹？"

 BA_Gehena_Event.0108.name:0 "将治安机构和内务机构交还给风纪委"
 BA_Gehena_Event.0108.desc:0 "    万魔殿与风纪委的妥协不止于此，万魔殿还需要将治安机构和内务机构交还给风纪委进行掌握，这样的举动对于自认为是胜利一方的真琴来说是不能接受的，但在伊吕波各种“以大局为重避免分裂”的情况下才换则罢了。即便如此，真琴反过来提出的要求确是日奈不能再担任风纪委员长，这让风纪委除了一人以外都无法接受，那个人便是日奈。\n    几乎所有人都对此表示惊讶，连真琴本人都没想到“日奈会轻松答应”的瞪大了双眼。\n    此刻，所有人都在挽留曾今的风纪委员长，然而风纪委员长却是仿佛已经计划好了一般与伊吕波对上了眼神，无言推辞。"
 BA_Gehena_Event.0108.a:0 "“不用当风纪委员长了？还有这种好事？”"

 BA_Gehena_Event.0109.name:0 "脱去担子的少女"
 BA_Gehena_Event.0109.desc:0 "    “一切的一切似乎不在计划之中，而又在计划之中。这或许便是‘山海经人’尝尝伴在嘴边的‘福祸相依’吧。”\n    日奈身着便装离开寝室，步行来到曾经的风纪委办公室，整理起自己仅剩的东西。此刻，千夏、伊织和亚子三人也直至最后一刻来到这，劝说日奈别离开。\n    “真琴说的只是玩笑话，日奈大人没必要当真啊！”\n    亚子流着泪挡在了准备离开的日奈面前，双手抓着日奈的两肩哭诉着。\n    日奈深呼吸了一口气，缓慢地回答道。\n    “风纪委没了我又不会不成方圆。你们还在就还能让风纪委成为基沃托斯最威武的风纪机构。况且，我又没说我会离开格赫娜，我只是从风纪委离任而已。”\n    “啊？”\n    “那.....那日奈你要去哪？”千夏一旁补充的问道。\n    “夏莱啊，我没说过嘛？”"
 BA_Gehena_Event.0109.a:0 "“啊？！”"

 BA_Gehena_Event.0110.name:0 "伊吕波的担忧"
 BA_Gehena_Event.0110.desc:0 "    “咿，终究是让那位大人先登城楼了。”\n    伊吕波躺在摸鱼室里叹气道：\n    “这下朝着最好又最坏的发展方向前进了，呜......不想干活......”\n    一个人在摸鱼室趟了老一会，才想起来一件事。"
 BA_Gehena_Event.0110.a:0 "“该去找伊吹讲讲清楚该干什么了。”" 

 BA_Gehena_Event.0111.name:0 "重担的内阁"
 BA_Gehena_Event.0111.desc:0 "    伊吹似乎没有想过，自己有一天能坐在联邦学生会长室的办公座位上。她所想能坐在这里的人，要么是自己的“大姐大”真琴，要么是自己的好姐姐伊吹，再要么也是风纪委那边的日奈大大，怎么着都没想过能轮得到自己坐在这个位置。\n    唯一的好消息是，联邦学生会长正式确立后，内阁运行速率并没有在此之前有所下降。伊吕波此时也拿着大量重要的文件来到了伊吹的办公室。\n    “伊吹啊.....”伊吕波满头大汗的手里拿了一叠纸质文件给伊吹。\n    “伊吕波姐姐，这是......”伊吕波几乎从未见过如此多的纸质文件。\n    “这些是用作归档的文件纸质版，需要你签名确认。”伊吕波拖着疲惫的脸颊笑了笑。\n    “唔......好，伊吕波姐姐先坐一会休息吧。”\n    虽然伊吹内心里还未清楚联邦学生会长这个职位到底要干什么，但上次伊吕波姐姐基本的伊吹梳理了些最基础且能干的几件事情出来，剩下的伊吹就自己慢慢看着学就行。\n    但是这才第一天，伊吹看着明显疲惫的伊吕波，心里已经有了明显的想法了："
 BA_Gehena_Event.0111.a:0 "“要不，找sensei帮帮忙吧。”" 

 BA_Gehena_Event.0112.name:0 "伊吹的想法"
 BA_Gehena_Event.0112.desc:0 "    久违的来到联邦学生会长办公室。\n    自步入星海时代以来，夏莱为了负责与基沃托斯各机构的沟通加装了许多通讯设备和成套的控制台后，联邦学生会会长办公室自己是不必亲身过去了，很多情况只需要通过主控台进行交流就好。但今天学生会长要求sensei务必来一趟办公室显然是出了什么问题了。\n    刚进办公室，伊吹就扑进了怀里\n    “sensei~sensei~帮帮伊吹嘛！”\n    轻轻抚摸着伊吹的头，心里深深地知道让这位小小的孩子承担如此重大的责任，她的内心的压力有多沉重。\n    “伊吹别担心，我来帮你了。来，我们到主控台旁边慢慢的聊。”\n    双手将伊吹抱在怀里，伊吹的体重非常的轻......将伊吹抱到主控台座位上放下来后，开始为伊吹慢慢的讲解学生会长的一些基本职能，以及伊吕波未来得及教授给伊吹有关主控台的操作。\n    伊吹细心的在听老师的讲解，同时今天让伊吹烦恼的政务也在老师的亲力亲为中轻松处理干净。\n    中途伊吕波过来送文件时，看到老师在伊吹的身边时，先是短暂的惊讶，而后很快的平复的心情跟老师交谈。\n    “很高兴能看到老师百忙之中能帮助伊吹同学。”伊吕波略带着喘气的挤出了感谢老师的话语，能感觉到这短时间伊吕波身上的担子也很重。\n    “学生需要帮忙我自然会一呼而到。倒是你伊吕波，这趟送完你先回去歇歇吧，剩下的交给我就行。”\n    “真……真的嘛？谢谢。”\n    伊吕波艰难的挤出笑容，然后离开了会长办公室。\n    “伊吕波姐姐……”看到这一幕的伊吹内心又开始纠结了起来。\n    “没事的没事的，今天伊吹的进步已经很大了。但是短时间内要学完所有的事情并不现实。伊吹，你究竟选择侧重于哪一种呢……”"
 BA_Gehena_Event.0112.a:0 "“伊吹我想，认真学习成为独当一面的学生会长”" 
 BA_Gehena_Event.0112.b:0 "“伊吹我想，尽自己所能的去迎合伊吕波的工作内容”" 

 BA_Gehena_Event.0113.name:0 "举旗人的要领"
 BA_Gehena_Event.0113.desc:0 "    自伊吹想成为独挡一面的学生会长开始，伊吹手头山的工作一大部分都暂时交给了伊吕波同学，只身独自在会长办公室里接受老师的辅导。\n    虽然伊吹的身躯看起来是小了些，但灵光的脑袋却能快速的接受相关的学习知识。伊吹不是被万魔殿的姐姐们保护住的小小花朵，相反，姐姐们提供的保护能让伊吹知晓更多。老师对此也是感到意外。\n    久而久之，伊吹基本上已经掌握了身为学生会长该有的手段的行为准则，但同时在面对更多不顺心的事务之后伊吹的笑容是越来越少的出现了。"
 BA_Gehena_Event.0113.a:0 "让伊吹成为学生会长，可能并不是特别好的抉择。" 

 BA_Gehena_Event.0114.name:0 "自我懵懂的信念"
 BA_Gehena_Event.0114.desc:0 "    今天开始是伊吹独自工作的日子，虽然老师依旧在一旁看着伊吹处理各地传输过来的文件，但相比以往来说，伊吹处理工作中的眼神里，参透着一丝以前从未有过的坚毅的目光。繁杂的程序文案渐渐地压在伊吹的肩膀上，没过几日伊吹已经出现疲惫不堪的摊在办公桌上的现象。\n    “没事吧伊吹？”不忍心再看下去，心疼的发问：“要不然今天的工作先放放吧？”\n    “没事的sensei。”伊吹勉强的摆出脸朝向老师笑了笑，额头已经冒出了些许水珠，“这都是为了姐姐们、为了学校里的同学们、为了基沃托斯的学生们不得不承受的。”伊吹颤抖的声音中夹杂着疲惫不堪的喘气。\n    “你这几天是没睡好吧？”\n    “呜......这几天失眠了，伊吹还是第一次体会到失眠......”\n    我见状连忙感到伊吹身旁，将大衣披在了伊吹身上：“伊吹你先安心睡吧，我已近明白你的信念了，今天先暂时休息吧，不急这一时。”\n    “呜......嗯......”"
 BA_Gehena_Event.0114.a:0 "此刻，伊吹在睡梦中，露出了久违的笑容。" 

 BA_Gehena_Event.0115.name:0 "伊吕波的认可"
 BA_Gehena_Event.0115.desc:0 "    深夜，联邦学园休息区内，老师相约好了伊吕波在工作结束时于此聊一聊。\n    空荡荡的休息区只有零零散散的几个值夜文员来这里吃点夜宵，老师则是坐在不起眼的角落里拿着平板翻阅文件，桌上摆着两份毫无热气的牛角面包和咖啡。\n    哒哒~哒哒~\n    宽广的走廊传来的脚步声足音跫然。将脑袋从文件里拔出来而朝声音看去时，那熟悉的身影已走到自己对面的座位上，软塌塌地入座了。\n    “诶。”伊吕波小声叹了口气，食指和中指并拢，轻轻弹触了一下面前的咖啡杯，“呃呜，好凉。”\n    “要不我再给你去温一温？”\n    我刚想起身，伊吕波慌忙的挽留：“不必了不必了。凉的也提神。”\n    两人放下自己手头的平板与文件，放松的开始吃着已经冷去的牛角面包与咖啡。时不时的借着喝咖啡的功夫用余光观察者伊吕波，伊吕波虽然依旧带着顶帽子，但边沿露出相当多的分叉，面容也能看出长时间面对计算机屏幕导致的干燥。相比这些，让人更加怜惜的是那反了深黑的厚厚的眼皮褶皱。伊吕波细嚼慢咽的把面包吃完后，喝了几口咖啡，面对着老师从容地露出的微笑：\n    “这段时间，伊吹真的很努力呢。我能明显到工作压力一天一天的下降，虽然直到今天我还是忙得要死。哈哈哈……”\n    “可是……”\n    “已经可以了。伊吹也不想看到劳累过度而倒下的伊吕波姐姐。”\n    起身走到伊吕波的身后，右手缓缓地抚摸着伊吕波的小脑袋，左手掏出随身携带的小梳子，轻轻的给伊吕波那凌乱的长发顺了顺。\n    两人保持了十几分钟后，只听见伊吕波的深呼吸……"
 BA_Gehena_Event.0115.a:0 "嗯……" 

 BA_Gehena_Event.0116.name:0 "格赫娜的大军改"
 BA_Gehena_Event.0116.desc:0 "    安顿于内，野望于外。在格赫娜学院内部自身整合完毕后，她们开始整合现有的资源将战略目标放到茫茫的星海之中。现阶段基沃托斯大量的军事武力主要还是分别受各个学院所管辖的散乱部队，在战时才会临时接受学院联邦统一调度。\n    格赫娜这边的决策层一致认为这种制度所带来的作战效率完全不符合格赫娜所代表的基沃托斯军事层面的作战计划，决定着手寻找一种大家能够统一规划和调度的制度。至此，格赫娜的管理开始自上而下的去忙活这件事。"
 BA_Gehena_Event.0116.a:0 "放手去做吧。" 

 BA_Gehena_Event.0117.name:0 "夏莱的一天"
 BA_Gehena_Event.0117.desc:0 "    距离没有去联邦学生会办公室也有半月之久，期间那边的事情已经没有什么紧急到需要亲身处理的情况了。清闲的夏莱倒是来了一位意外的客人。\n    “sensei~伊吹来了哦~”\n    能直接越过夏莱门禁权限来办公室的也就只有现在的联邦学生会长了。（存疑）\n    “今天伊吹没有在忙嘛，还是说有什么要紧的事情来找我了？”\n    “诶嘿嘿~~~伊吹在办公室忙着军改的事宜，等缓过神来才发现sensei已经好久没来联邦学生会办公室啦~~~伊吹就是想来看看sensei的说~~~”\n    “诶？没有妨碍其他工作吧，这是坏学生的行为哦。”\n    “伊吹不是坏学生！唔姆……伊吹可是完完整整的把工作内容安排完了在休息时间来找sensei的！”伊吹跳到老师的身上气鼓鼓的捏着老师的脸蛋\n    “哎呀哎呀，是我的的错，伊吹是最乖最棒的孩子！”\n    “哼~”伊吹从老师的身上跳了下来，看向老师的电脑屏幕上，分窗口显示着格赫娜这次军改所对外公布的大量明细。\n    “吼吼~~sensei原来依旧这么在意呀……”\n    “虽然我不去那边了，但很多情况都还是需要了解的。”\n    “那sensei有空嘛，嘿嘿……其实伊吹还是有一些问题想找sensei请教。”说着伊吹连忙从旁边推来椅子，紧贴老师的边上，略带放松的倚靠在老师的身上。"
 BA_Gehena_Event.0117.a:0 "嗯，我们开始吧。"  

 BA_Gehena_Event.0118.name:0 "独立的扛旗人"
 BA_Gehena_Event.0118.desc:0 "    在最近的一次联邦学生会公开演讲上，伊吹站在演讲台处，花了半小时流利且自信的阐述了格赫娜上下层与内阁齐心协力所构建出的新军事编制体系，其中囊括了各学院最基本的军队自治权，治安管理权，常态化军事管理和战时军事管理四种情况，且基于上述四种情况规定了相关的军制，作战整编和指挥权交付等多项细则。\n    在伊吹一口气讲完的那一刻，台下的各个学院的相关负责人鼓起了热烈的掌声。一方面，这次军改的覆盖面非常之广，且很多地方都照顾到了各个学院的权益，另外一方面，伊吹本人流程的演讲和其中插入的相关问题也是对答如流。\n    独自一人的夏莱此刻也不禁想起了两个人的掌声。\n    “诶？”\n    伊吕波此刻来到了夏莱。\n    “你们俩的会长权限真的是共用的啊.....不过这么重大的事情伊吕波你不在幕后负责帮忙嘛？”\n    “诶嘿嘿~~~其实都到了这一步，已经不需要我在操心了。这不就是你想要看到的嘛？Sensei~”"
 BA_Gehena_Event.0118.a:0 "伊吹做的很棒了哦。"  

 BA_Gehena_Event.0119.name:0 "基沃托斯“最高峰”的风景"
 BA_Gehena_Event.0119.desc:0 "    自上次伊吹来夏莱后，也没怎么去联邦学生会转转了。若不是受伊吹邀请估计今天也没有打算去一次。最近没有什么大事，夏莱这边收到的一些学生的委托帮忙也较为琐碎，也是相当平静。\n    走进会长办公室时，发现硕大的屋内一个人影都见不到，只见正对着自己远处的办公桌上的电脑依旧亮着屏幕。\n    往远处眺望去，发现办公桌的后面的阳台大门打开着。越过办公桌走到阳台时，看见伊吹一个人倚靠在栏杆上，眺望着整个基沃托斯。\n    伊吹听到门口的稳健的脚步声传来时，发觉了是老师的到来。\n    “sensei来了呀……sensei觉得，基沃托斯如今这样已经可以了嘛？”\n    伊吹并没有回头，而是接着看望远望，背对着老师发问。\n    只是平静的走到伊吹身边，并没有急着回答。靠近伊吹的时候，一把将伊吹爆起来，让伊吹骑在自己的肩膀上。\n    “诶~sensei！Sensei这是在干嘛”显然伊吹被sensei的动作吓坏了。\n    “这是在进一步的‘提升’哦。”\n    “提升？”伊吹被老师的动作吓得双手乱抓着老师的衣裳，生怕自己摔了下来。\n    “基沃托斯是学生们的学园都市，学生的成长代表者基沃托斯的成长。每向上前进一步总能看到更美好的风景。从最初站在这俯瞰基沃托斯，到比如星海壮实自己的实力以俯瞰整个星海。每一步每一步到最后归根结底还是学生们自身的努力与成长。”\n    “诶……伊吹受教了”\n    伊吹在心情平复之后，接着眺望着远处的风景，在这时，伊吹若有所悟的笑了笑。\n    “伊吹好像，理解了sensei的意思了。”\n    “那要下来嘛？”\n    “不，不要，可以让伊吹就这样多待一会嘛……”"
 BA_Gehena_Event.0119.a:0 "当然可以哦。"  

 BA_Gehena_Event.0120.name:0 "伊吕波的想法和伊吹的心意"
 BA_Gehena_Event.0120.desc:0 "    前些日子伊吕波来了趟夏莱，聊了聊伊吹的事情。伊吹现在已经成为一个合格的执行官了，多亏sensei长时间陪伴的教导。\n    伊吕波这样归功的话，其实是不满意的。伊吕波在这段时间内的付出可谓是海量的，帮助伊吹统合了格赫娜的内阁并且主动与其他与其他学院交涉，相比起一个只会做幕后数据统合与分析而提出方案与建议的大人来说，功劳不谓之不甚。\n    就伊吹的后续计划，伊吕波有所迟疑，因为这段时间两人各自忙碌，已经有很长一段时间没有像样的私底下的交流了，时间一久两人反而有点不太主动去开这个口子。\n    “这件事交给我吧，伊吕波同学。你也不要瞎想。”\n    趁着联邦学生会的休息日，约了伊吹一趟在办公室的阳台聊一聊。有了上次之后伊吹似乎很喜欢两人在阳台聊天，同时嚷嚷着要骑在身上，似乎这样能让伊吹的心里有所安心。\n    两人像往常一样，将伊吹骑在背上和伊吹聊天“伊吹呀，伊吕波最近跟我说想放个长假休息休息。”\n    “诶？伊吕波姐姐怎么了？”\n    “额，伊吹没有去问过嘛……”\n    “啊……伊吹……伊吹似乎忙联邦学生会的事太忘我了，平时和伊吕波姐姐只有工作上的聊天，而且伊吕波姐姐无时无刻都在用笑容面对着我……”\n    伊吹自顾自的回想起当时的重重场景，似乎是意识到了什么。\n    “呜……伊吹，伊吹好像做错事了……”\n    “其实也不算错。伊吕波同学肯定知道伊吹同学工作上的内容有多么紧凑。现在安稳下来了，也该回去找伊吕波同学一起玩完了呗~学生会长的事情在安排下去之后，其实也没有什么太多需要亲力亲为的事情了。”\n    “那万一有什么紧急的事情呢？”\n    “不还有我嘛，我会帮你们紧急处理的。”\n    “嘿嘿嘿~~~”\n    “那伊吹现在要去嘛？”\n    “不要，等我现在sensei身上想好”"
 BA_Gehena_Event.0120.a:0 "“维持现状就挺好的哦，继续做伊吕波姐姐的助力。”"  
 BA_Gehena_Event.0120.b:0 "“伊吕波姐姐应该走到台面上来哦，格黑娜的今天少不了伊吕波姐姐呢。”"  

 BA_Gehena_Event.0121.name:0 "举旗人的自重"
 BA_Gehena_Event.0121.desc:0 "    自伊吹想成为独挡一面的学生会长开始，伊吹手头山的工作一大部分都交给了伊吕波同学，只身独自在会长办公室里接受sensei的辅导。\n    虽然伊吹的身躯看起来是小了些，但灵光的脑袋却能快速的接受相关的学习知识。\n    伊吹是被万魔殿保护着的温室花朵，但即便如此伊吹还是有自己的觉悟的。即便是成为一个有名无实的联邦学生会长，自己也要学会如何做好明面上需要维护的事情，不能给伊吕波姐姐添乱。\n    久而久之，伊吹基本上已经掌握了身为学生会长该有的手段的行为准则，而伊吕波那边已经开始忙的焦头烂额。\n    虽然觉得这样安排不是很妥当，但眼下自己也得投入这次万魔殿的豪赌了。"
 BA_Gehena_Event.0121.a:0 "放手去做吧。"   

 BA_Gehena_Event.0122.name:0 "小小的摸鱼时刻"
 BA_Gehena_Event.0122.desc:0 "    中午，今天受伊吕波的邀请前往内阁办公室，和伊吕波一起商讨一下今后的打算。\n    刚走进办公室，看到左右的办公桌堆满了满满的归档用纸质文件和大量常亮的屏幕，却空无一人，只留下伊吕波一个人在管理台那打下靠椅平躺着。\n    听到有人推门进来，伊吕波娴熟的拉起靠椅，看到是老师走了进来，非常放松的进行了深呼吸。\n    “这样的我，是不是有点狼狈了？”\n    “你不一直都这样嘛？”\n    “哈哈哈哈~~~”\n    带着文件径直走到伊吕波旁，才发现硕大的办公桌挡住了给我准备好的小靠椅。\n    “这里的椅子都长这样了，没时间临时去隔壁给老师借个大的。虽然我很想起身把座位让给老师，但是老师也是懂我的。嘻嘻……”\n    “没事，现在基沃托斯最累的人除了你也找不到第二个了”\n    “啊哈哈……说起来喊老师过来是想讨论今后的一些发展和规划。我实在是没有力气去夏莱了，还要麻烦你过来一趟。”\n    “无碍，伊吕波同学不说我也会过来的。”"
 BA_Gehena_Event.0122.a:0 "“这样嘛。不管怎么说还是谢谢老师了”"

 BA_Gehena_Event.0123.name:0 "更重的担子"
 BA_Gehena_Event.0123.desc:0 "    这段时间内，伊吕波所带领的内阁整合了格赫娜内部的参与力量，起码能够做到政通令达。但这仅仅是格赫娜内部的事，她们需要做的是在学院联邦层面上，有一份独属于她们自己的政绩，至此她们把目光放在了基沃托斯的军事改革上。\n    与各个学院沟通并收集相关需要的军事内容和项目是一件非常复杂的事情，没有预先做好充足的准备很容易会陷入其他学院的政治诈骗之中，整个内阁与下属的文职部门都开始忙碌了起来。\n    因此，伊吕波现在的工作量比平时要高出三倍不止，开始出现咖啡代水的非健康习惯了。"
 BA_Gehena_Event.0123.a:0 "这可不是什么好消息啊。"

 BA_Gehena_Event.0124.name:0 "不堪重负"
 BA_Gehena_Event.0124.desc:0 "    随着军改的进行，大量的工作已经排上了日程，伊吕波日以继夜夜以继日的忙活着相关的事情，整个人的神情像是行尸走肉一般。被工作挤满的大脑里，有一丝的神智提醒着伊吕波——\n    我是不是该摸鱼了？\n    双手颤抖的掏出手机打开momotalk，给老师发了条消息过去："
 BA_Gehena_Event.0124.a:0 "“呐，老师……我们老地方见面吧？”"

 BA_Gehena_Event.0125.name:0 "久违的摸鱼室"
 BA_Gehena_Event.0125.desc:0 "    记得上一次来伊吕波的摸鱼室还是格赫娜内部选举前夕，和伊吕波聊了当时格赫娜两边内部各自的规划。在那之后伊吕波就把摸鱼室的钥匙给了我一把。\n    下午伊吕波发来一条消息，晚上在摸鱼室聚一聚，momotalk回信时伊吕波却在没有应答。\n    提前了一些时间到了摸鱼室，一走进去能闻到一些长久时间无人打理的霉味，只能亲自去外头买些清洗用具来整理了。\n    忙活了一个半小时，这间摸鱼室才有了往日的样子。距离约定的时间已经过了半小时，伊吕波还是没到。\n    最后再整理一下，出门来了点吃食，回来时已经发现伊吕波瘫软的趴在地桌上，毫无动弹。\n    “辛苦了，伊吕波同学。”\n    把吃食放在了桌子上，伊吕波才回过神来我的到来。\n    “呜……我还以为老师觉得自己辛辛苦苦打扫了屋子等我来，结果以为我失约了生气的离开了。呜……”\n    “饿了吧……看你有气无力的样子一来就瘫在这了……”\n    “嗯……”\n    伊吕波大吃特吃一顿，吃完了还没吃饱看向了老师手里的食物，尴尬地扭捏时老师毫无在意的将手里吃食递给了伊吕波。\n    “看来是真饿坏了。在联邦学生会那边看来是把你忙坏了，一点饭都没吃。”\n    伊吕波狼吞虎咽之后，满意的倒在地毯上，呆呆地看向天花板。\n    我起身点开夜灯，关掉大灯，之后陪同伊吕波一起躺着。\n    “我们，是不是很久没这样休息过了”\n    “算是吧。”\n    “突然觉得今天能这样子又闲下来，还挺幸福的。”\n    “以后也能这样的。”\n    “是嘛？我感觉很难”"
 BA_Gehena_Event.0125.a:0 "“我会帮你。”"

 BA_Gehena_Event.0126.name:0 "举旗人的变革"
 BA_Gehena_Event.0126.desc:0 "    在最近的一次联邦学生会公开演讲上，伊吹站在演讲台处，花了半小时流利且自信的阐述了格赫娜上下层与内阁齐心协力所构建出的新军事编制体系，其中囊括了各学院最基本的军队自治权，治安管理权，常态化军事管理和战时军事管理四种情况，且基于上述四种情况规定了相关的军制，作战整编和指挥权交付等多项细则。\n    在伊吹一口气讲完的那一刻，台下的各个学院的相关负责人鼓起了热烈的掌声。一方面，这次军改的覆盖面非常之广，且很多地方都照顾到了各个学院的权益，另外一方面，伊吹本人流程的演讲和其中插入的相关问题也是对答如流。\n    我和伊吕波两人在摸鱼室里变躺着边观看着前方直播。\n    “起码在表面功夫上，伊吹做的已经很好了。”\n    “伊吹起码这些天在我忙生忙死的时候，还是让我减少了很多担忧。伊吹也是在成长的”\n    “军改的事宜已经告一段落了，伊吕波你也可以休息一阵子了吧。”\n    “但愿吧。起码现在，是可以好好休息了。”"
 BA_Gehena_Event.0126.a:0 "一切都在向好，这就足够了。"

 BA_Gehena_Event.0127.name:0 "所依靠的另一半"
 BA_Gehena_Event.0127.desc:0 "    键盘噼里啪啦作响，疲劳的少女依旧深沉的睡眠。\n    空荡荡的办公室，只剩下两个人在电脑面前忙碌。\n    少女似乎意识到了什么，拖着脑袋看向那壮实的身影。\n    “老师……嘛？”\n    大人迅速且娴熟的指法，高速晃动的眼神，专心的投入在眼前的工作。\n    “我好像，是不是睡着了……老师？”\n    少女那疲劳的身躯发起了抗议，自身的双眼无法控制的闭上。真想张开双眼去看看那个可靠的身影。\n    “你还真是没法让我安心呢，伊吕波。放心吧，好好睡觉”\n    少女慌忙的睁开了双眼，发现办公室里除了自己和身边的硕大身躯外毫无一人，最远处的大门被紧紧地关上，还用椅子堵了起来。\n    那温暖且安心身躯正在熟睡，少女打开手机一看才发现自己睡了一天一夜。屏幕上的工作内容已经近乎完成，留下来的只有半夜发来的一些各地的琐碎小事。\n    “这样嘛……”"
 BA_Gehena_Event.0127.a:0 "少女看向了那满足的面容，依偎着身躯一同睡去。"

 BA_Gehena_Event.0128.name:0 "优化完毕的内阁"
 BA_Gehena_Event.0128.desc:0 "    随着格赫娜的军改成功结束，以及伊吕波的四处奔波，使得以伊吕波为首的格赫娜内阁得到了充分历练与权利掌握，现在展现在伊吹学生会长面前的是一个非常效率且非常有实权的内阁。自身只需要做好本分的事情，指挥着这个得心应手的内阁，下达联邦的政令，基沃托斯就能够稳步前进了。"
 BA_Gehena_Event.0128.a:0 "告一段落了。"




 BA_Gehena_Event.0201.name:0 "日常的少女"
 BA_Gehena_Event.0201.desc:0 "    身着常服的少女叩开夏莱的大门，sensei已经在里头等候多时。\n    陪在sensei身边在夏莱里头工作，既是掌握基沃托斯全部领域的后台中心，也是全世界各地的学生遇到困难时远程求助老师的地方。\n    今后的日子或许和往常一样繁忙，但对于日奈来说，陪在sensei身边工作亦或是一种满足。\n    “今后就拜托你了，日奈。”"
 BA_Gehena_Event.0201.a:0 "“嗯。”"




 BA_Gehena_Event.0301.name:0 "晚宴"
 BA_Gehena_Event.0301.desc:0 "    新年即将到来，在格赫娜为代表的学院联邦决定在联邦大楼举办晚宴。一来是为了庆祝节日，二来是为了展现现在在学院联邦的内阁层和学生会长今日的努力与成果。学生会长本人似乎还打算在晚宴上发表一些新的宣言。\n    内阁安排了众多文员一一向各学院传达本次晚宴的重要性，足以见得格赫娜方面对此非常重视。\n    当晚，整个联邦大厅人山人海，各大学院的主理人和重要部员系数到处，一同欣赏着各个学院相互帮忙之下表演的精彩节目。"
 BA_Gehena_Event.0301.a:0 "似乎，有一个学生想要找我谈谈……？"

 BA_Gehena_Event.0302.name:0 "ALL FOR HINA"
 BA_Gehena_Event.0302.desc:0 "    节目接近尾声之时，灯光熄灭，主舞台上打开了一处平台，由下往上缓缓升起的是一台装饰华丽的钢琴。\n    灯光骤起，日奈在舞台上身着华丽的礼服，开始倾心的弹奏着动人心弦的乐曲，十几分钟不间断的演奏，时而古典，时而现代，时而悠扬，时而紧凑，将自踏入星海以来，基沃托斯学生们经历过的辛酸苦辣甜以琴音的方式表达出来，余音缭绕，连绵不绝，在场的学生们都陶醉在此中。"
 BA_Gehena_Event.0302.a:0 "付出在这一刻得到了回报。"

 BA_Gehena_Event.0303.name:0 "属于你的时间"
 BA_Gehena_Event.0303.desc:0 "    黑暗的房间内，点亮了一盏小夜灯，与伊吕波两人躺在地毯上。\n    两人都没有参加这次新年晚会，忙碌了几年，相比于展现于众人，不如找个地方犒劳自己休息休息。\n    电视放着晚会的节目，与伊吕波欢声谈笑，累了就接着睡去。此刻，现在的时间才是真正的属于两人，不需考虑他人，不用在意工作，不会产生焦虑，不怕错过事情。"
 BA_Gehena_Event.0303.a:0 "这就足够了。"

 BA_Gehena_Event.0304.name:0 "她的决心"
 BA_Gehena_Event.0304.desc:0 "    在节目结束之时，伊吹穿着华丽的礼服走到了舞台上，讲述者这些年来的努力，最近的工作效果和对未来的掌握，出口成章，侃侃而谈，丝毫没有了当初接任联邦学生会长的胆怯与自卑。\n    十几分钟的演讲间，掌声频频。大家都认可了这位会长，一位身体虽小志向广大的联邦学生会长。"
 BA_Gehena_Event.0304.a:0 "至此，少女成长为一位合格的接班人。"

 BA_Gehena_Event.0304.name:0 "二人的决意"
 BA_Gehena_Event.0304.desc:0 "    在节目结束之时，伊吹穿着华丽的礼服走到了舞台上，讲述者这些年来的努力，最近的工作效果和对未来的掌握，出口成章，侃侃而谈，丝毫没有了当初接任联邦学生会长的胆怯与自卑。十几分钟的演讲间，掌声频频。大家都认可了这位会长，一位身体虽小志向广大的联邦学生会长。\n    尾声，伊吹走到台边，将依旧穿着工作常服伊吕波拉到舞台上，向大家讲述这些年伊吕波在大大小小的事务上支持伊吹的事迹。讲到最后，伊吹抱紧伊吕波，伊吹能走到今天无法离开伊吕波的幕后付出，伊吹向大家介绍着这位最好的姐姐，同时也宣告伊吕波今天开始也会走到台面上，两人一起为基沃托斯的未来去筹划。"
 BA_Gehena_Event.0304.a:0 "意料之中的结果。"
