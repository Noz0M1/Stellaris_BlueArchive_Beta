 # 舰船装备科技
 tech_BA_EQ_Offense_T1:0 "舰船用火力装备T1"
 tech_BA_EQ_Offense_T1_desc:0 "将帽子、手套和鞋子整合为一套舰船用进攻装备，可以全面强化战舰的火力表现。"
 tech_BA_EQ_Offense_T2:0 "舰船用火力装备T2"
 tech_BA_EQ_Offense_T2_desc:0 "更可靠的帽子、手套和鞋子能够进一步提高战舰的进攻能力。"
 tech_BA_EQ_Offense_T3:0 "舰船用火力装备T3"
 tech_BA_EQ_Offense_T3_desc:0 "改良过的装备兼顾武器威力与作战稳定性，使舰载武器能够充分发挥性能。"
 tech_BA_EQ_Offense_T4:0 "舰船用火力装备T4"
 tech_BA_EQ_Offense_T4_desc:0 "制造石工艺让帽子、手套和鞋子获得了远超传统材料的性能。"
 tech_BA_EQ_Offense_T5:0 "舰船用火力装备T5"
 tech_BA_EQ_Offense_T5_desc:0 "成熟的复合结构进一步放大了三种装备各自擅长的进攻性能。"
 tech_BA_EQ_Offense_T6:0 "舰船用火力装备T6"
 tech_BA_EQ_Offense_T6_desc:0 "反物质能源与制造石部件的结合，使装备能够稳定承受更高强度的作战负荷。"
 tech_BA_EQ_Offense_T7:0 "舰船用火力装备T7"
 tech_BA_EQ_Offense_T7_desc:0 "制造石自动成型技术可以精确塑造每一个部件，将装备的性能推向常规材料的极限。"
 tech_BA_EQ_Offense_T8:0 "舰船用火力装备T8"
 tech_BA_EQ_Offense_T8_desc:0 "经过浓缩暗物质改造的帽子、手套和鞋子，拥有以往难以想象的进攻潜力。"
 tech_BA_EQ_Offense_T9:0 "舰船用火力装备T9"
 tech_BA_EQ_Offense_T9_desc:0 "强化暗物质结构令装备在极端战况下仍能维持压倒性的火力增幅。"
 tech_BA_EQ_Offense_T10:0 "舰船用火力装备T10"
 tech_BA_EQ_Offense_T10_desc:0 "零重力生产与暗物质技术的结晶，是追求极致火力的顶配主义装备。"

 tech_BA_EQ_Defense_T1:0 "舰船用防护装备T1"
 tech_BA_EQ_Defense_T1_desc:0 "将徽章、背包和发夹整合为一套舰船用防御装备，可以全面提高战舰的生存能力。"
 tech_BA_EQ_Defense_T2:0 "舰船用防护装备T2"
 tech_BA_EQ_Defense_T2_desc:0 "更可靠的徽章、背包和发夹能够为战舰提供更加坚实的防护。"
 tech_BA_EQ_Defense_T3:0 "舰船用防护装备T3"
 tech_BA_EQ_Defense_T3_desc:0 "改良过的装备进一步强化了船体结构，并让三种装备各自的防护方式更加完善。"
 tech_BA_EQ_Defense_T4:0 "舰船用防护装备T4"
 tech_BA_EQ_Defense_T4_desc:0 "制造石工艺让徽章、背包和发夹在不增加过多负担的情况下提供更强防护。"
 tech_BA_EQ_Defense_T5:0 "舰船用防护装备T5"
 tech_BA_EQ_Defense_T5_desc:0 "成熟的复合防护结构显著增强了装备抵御持续攻击的能力。"
 tech_BA_EQ_Defense_T6:0 "舰船用防护装备T6"
 tech_BA_EQ_Defense_T6_desc:0 "反物质能源为先进防护系统提供了充足动力，使装备可以应对更加严酷的战场。"
 tech_BA_EQ_Defense_T7:0 "舰船用防护装备T7"
 tech_BA_EQ_Defense_T7_desc:0 "制造石自动成型技术使每一处防护结构都趋近完美，将装备提升至常规技术的顶点。"
 tech_BA_EQ_Defense_T8:0 "舰船用防护装备T8"
 tech_BA_EQ_Defense_T8_desc:0 "暗物质强化的徽章、背包和发夹可以承受传统防御材料无法应对的冲击。"
 tech_BA_EQ_Defense_T9:0 "舰船用防护装备T9"
 tech_BA_EQ_Defense_T9_desc:0 "强化暗物质结构进一步提高了装备的稳定性与战场生存能力。"
 tech_BA_EQ_Defense_T10:0 "舰船用防护装备T10"
 tech_BA_EQ_Defense_T10_desc:0 "零重力生产与暗物质技术的结晶，为战舰带来无可挑剔的顶级防护。"

 tech_BA_EQ_Auxiliary_T1:0 "舰船用辅助装备T1"
 tech_BA_EQ_Auxiliary_T1_desc:0 "将手表、项链和护符整合为一套舰船用辅助装备，可以改善战舰的综合作战表现。"
 tech_BA_EQ_Auxiliary_T2:0 "舰船用辅助装备T2"
 tech_BA_EQ_Auxiliary_T2_desc:0 "更可靠的手表、项链和护符能够为战舰提供更加稳定的辅助能力。"
 tech_BA_EQ_Auxiliary_T3:0 "舰船用辅助装备T3"
 tech_BA_EQ_Auxiliary_T3_desc:0 "改良过的装备加强了各系统之间的协调，使战舰能够更从容地应对复杂战况。"
 tech_BA_EQ_Auxiliary_T4:0 "舰船用辅助装备T4"
 tech_BA_EQ_Auxiliary_T4_desc:0 "制造石工艺令手表、项链和护符可以承担更加精密的舰载辅助功能。"
 tech_BA_EQ_Auxiliary_T5:0 "舰船用辅助装备T5"
 tech_BA_EQ_Auxiliary_T5_desc:0 "成熟的复合系统让三种装备可以更加充分地发挥各自的辅助特性。"
 tech_BA_EQ_Auxiliary_T6:0 "舰船用辅助装备T6"
 tech_BA_EQ_Auxiliary_T6_desc:0 "反物质能源为先进辅助系统提供了充足余量，使装备能够支持更高强度的行动。"
 tech_BA_EQ_Auxiliary_T7:0 "舰船用辅助装备T7"
 tech_BA_EQ_Auxiliary_T7_desc:0 "制造石自动成型技术使精密辅助部件浑然一体，将装备提升至常规技术的顶点。"
 tech_BA_EQ_Auxiliary_T8:0 "舰船用辅助装备T8"
 tech_BA_EQ_Auxiliary_T8_desc:0 "暗物质技术赋予手表、项链和护符前所未有的调控能力与系统潜力。"
 tech_BA_EQ_Auxiliary_T9:0 "舰船用辅助装备T9"
 tech_BA_EQ_Auxiliary_T9_desc:0 "强化暗物质结构令装备可以在极端环境中持续维持舰船系统的高效运转。"
 tech_BA_EQ_Auxiliary_T10:0 "舰船用辅助装备T10"
 tech_BA_EQ_Auxiliary_T10_desc:0 "零重力生产与暗物质技术的结晶，是统筹舰载系统与战略机动的顶配主义辅助装备。"

