l_simp_chinese:
#### 蓝鲸之梦（星野就职事件链）
 BA_origin.0101.name:0 "走在过去与未来的交叉口"
 BA_origin.0101.desc:0 "    星野什么都没有说，只是示意我跟着她走。就这样跟在她身后，我不由得慢慢欣赏起了这个比我矮了一头的少女。\n    从表面上看，她似乎与寻常的女孩子没什么两样，硬要说有什么印象的话，恐怕就是懒洋洋的？就像是，已经看淡了人生一般\n    但是如果仔细观察的话，便会发觉她不同于寻常人的气质：她迈出的每一步总是带着坚定，像是一个从生活的磨砺中走出来的人，是一个认定了自己的目标就绝对不回头的人，她背后的霰弹枪总是被保养得很好，即使是再懒惰的她也有不可懈怠的事情吧？事实也确实是如此，阿拜多斯从最初的两个人，再到只剩下她一个人，再到今天的繁华，这期间经历的所有苦难和风雨，凝聚成了这个阿拜多斯的复兴之人。我相信她已经准备好迎接所有挑战了\n    行走在如今繁华的阿拜多斯，我不知为何感觉她与四周的环境格格不入，我留意到她不同寻常的打扮，一身老旧的防弹衣，我似乎在哪里见过……在那种老照片上……\n    我大概明白了一些事情，我想，也许在她看来，此刻的繁荣毫无意义吧？"
 BA_origin.0101.a:0 "因为，在她的庆功宴上，有一个缺席的人。"
 BA_origin.0101.b:0 "并且，那个人恐怕再也来不了了。"

 BA_origin.0102.name:0 "与你一同面对的未来"
 BA_origin.0102.desc:0 "    我们两个人避开繁华的川流不息的车流，一路来到了一个令我怀念的地方——阿拜多斯的旧校舍，这附近还是一如往日的宁静，或许是她刻意的吧。\n    一路上我们都没有交流，她领着我一路走到了对策委员会曾经的部室。尽管在很久之前这里就已经不再使用了，但是一点破败的感觉都没有，我和她坐在平日就座的位置，我留意到，部室比平常多了一把椅子。\n    “所以，星野为什么突然就想回来看看呢？”\n    “只是突然很怀念过去的日子而已……”她看向窗外，那里正对着阿拜多斯的最后一片沙漠——我记得那里是曾经举行沙漠祭的地方。\n    “大叔我以前，并不相信这个世界上有奇迹存在，我始终觉得，那是哄小孩子的话……但是当我面对着如今繁荣的光景的时候，我又不得不承认——它真的，是一个活生生的奇迹”\n    “是我和老师一起，共同见证的奇迹……”\n    我不清楚该如何回答这番别有深意的话，但是有一件事情是可以清楚的……"
 BA_origin.0102.a:0 "我决定，尽我最大的努力，支持这个坚强的少女。"

 BA_origin.0103.name:0 "黎明之前"
 BA_origin.0103.desc:0 "    今天星野起得格外早，也许是因为昨晚难以入眠，要是是在平常，星野怎么也应该回去睡个回笼觉，不过今天却是怎么也睡不着。\n    她没有穿学生会长的制服，而是久违地换上了一直珍藏着的阿拜多斯的校服，仍是觉得放心不下，索性就把那件防弹衣也换上了。\n    不知从什么时候起，夏莱附近的天气转阴了，又湿又冷，大团大团的像棉絮一样的浓雾弥漫在街道上，透过这弥漫着的迷雾，就连霓虹灯的灯光也变成大团大团的了，水雾在星野的脸上挂了一层薄薄的水珠，就像是挂了一层蜘蛛网一样粘稠。\n    她突然开始怀念阿拜多斯干燥的气候了，至少不会有这样烦人的雾，还有……阿拜多斯的前辈……\n    天渐渐蒙亮了，星野收起了往日的懒散和看淡人生的态度——只有她自己知道，那不过是对前辈拙劣的模仿罢了，取而代之的是一副冷淡的神情，那才是她本来的样子，至少，就她自己认为，她从来没有改变过。\n    星星和月亮已经退场了，而太阳还未升起，这灰蒙蒙的天空是如此空荡，寂寞。"
 BA_origin.0103.a:0 "在太阳升起之前的一段时间，往往是最黑暗的。"

 BA_origin.0104.name:0 "蓝鲸之梦"
 BA_origin.0104.desc:0 "    在闲暇的时候，星野总是会回到度假村，无言地眺望着大海，平静的大海，机械地起伏，是什么如此吸引着这位来自沙漠深处的少女呢？\n    她眺望着平静的大海，幻想着在那海面之下，有一个大家都在的世界，她从未真正见识过海底的世界，正因为不曾见过，所以才能承载着她的期盼。\n    她眺望着平静的大海，她清楚这不过只是她的一个幻想，至少鲸鱼并不存在于基沃托斯的海洋之下，可就算无法与鲸鱼相见，海里的鱼儿也会坚强地，快乐地生活下去的吧？\n    她眺望着平静的大海，为什么会忽然感到悲伤呢？她亲手埋葬了自己的前辈，与之一起的还有自己的过去，本应答应鲸鱼从此与泪水告别，她卸下了自己表现出来的成熟，因为成熟从来就不是表现出来的。\n    她眺望着平静的大海，为何突然追忆起过去？也许鲸鱼再也不会回来了，但是她仍然久久在原地守候，她要慢慢讲述阿拜多斯的复兴之路，还有她在历经艰辛之后沉淀出来的真正的成熟。\n    走过了没有星辉的夜晚，洗尽了过往的尘埃，如今当迎来新升的旭日，她早已不是孤身一人，她的身后有陪伴着她走到现在的后辈们，还有一位自己能绝对信任的大人。"
 BA_origin.0104.a:0 "这位自称大叔的少女决定再次追逐曾经的梦。"

 BA_origin.0105.name:0 "在奇迹的出发点"
 BA_origin.0105.desc:0 "    “是为了梦前辈的事情而来的吧？”在星野走进来的时候，我便多少从她脸上读出了些什么，更何况是那位梦前辈。\n    “真是什么也瞒不过老师……”她有些尴尬地笑了笑“大叔我就直说了吧，因为和光环研究的事情仍然在争论不休，所以相关的研究还是让老师批准会好一点。”\n    “这到不是什么难事，我一会就去通知千年那边，再怎么说梦也是基沃托斯的学生之一，星野酱尽管去做就好了，很少看见懒洋洋的大叔这么有干劲呢~”\n    “老师又拿大叔我取笑！（小声）明明我也有很努力来着……”\n    “是，星野酱也在好好努力哦。”\n    不知为何，在走出夏莱的时候，她忽然感到一种格外的轻松感。"
 BA_origin.0105.a:0 "也许，在她未曾注意的地方，她也在慢慢改变吧。"

 BA_origin.0106.name:0 "蓝鲸之梦——光环解析"
 BA_origin.0106.desc:0 "    星野酱从实验的仪器上走下来，对于她光环主要成分的解析已经完成，这份数据将用于为梦前辈制造空白光环以及未来为其他生物制造光环做准备。\n    这台仪器毕竟曾经是数秘术的科技产物，尽管已经进行了无害化处理，但是我们还是反对曾经作为受害者的星野参与这次实验。\n    不过星野本人并不管这些，她说没有比她这个曾经的实验品更适合这个实验的对象了。也许她不过是想为前辈的苏醒出一份自己的力量吧。"
 BA_origin.0106.a:0 "进行下一步计划吧。"

 BA_origin.0107.name:0 "蓝鲸之梦——空白光环制造"
 BA_origin.0107.desc:0 "    根据分析的结果来看，我们需要一些能够承载光环力量的物质来制造光环，青辉石是一个廉价的选择，但是它的承载力远远不够，因此我们只好暂时使用稀有的神名文字，也许在将来我们会找到更好的替代品吧。\n    一个空白的，崭新的光环已经制造完成，它看起来就像是基沃托斯随处可见的杂鱼酱头上的光环一样，甚至比那更加简陋，我们将通过一个预留的接口导入梦前辈光环的数据，数据仅此一份，成败在此一举。"
 BA_origin.0107.a:0 "放手去做吧。"

 BA_origin.0108.name:0 "蓝鲸之梦——归来"
 BA_origin.0108.desc:0 "    青辉石建立的传输链接格外缓慢，随着最后一点数据的注入，光环的形状也随之改变。在确认了光环的状态稳定之后，我们小心翼翼地把光环连接上梦的身体\n    在光环启动的动画之后，她缓缓睁开了她的眼睛。\n    “唔……这里是哪里？我记得我应该是在实验室里才对……”\n    “看来记忆是没有问题的……啊，真是失礼，我应该先自我介绍的，我是夏莱星系探索局的老师，你应该不认识我，我知道你现在应该有很多问题，不过现在有个更重要的事情——星野酱在外面等你，准备好之后你就去见她吧。”\n    我顿了一下。\n    “她一直在等你，等了很久了，大概有好几年了吧。”\n    ……\n    在两人目光交汇的一瞬间，两人的表情和动作都定个在了那一刻，不如说是就连空气都凝结住了，相别数年，许许多多想说的话，阿拜多斯的变化，夏莱的老师，星空上的世界……在此刻却全部卡在了喉咙里，不知道从何说起。沉默良久，星野酱先打破了这个尴尬的局面："
 BA_origin.0108.a:0 "“好久不见，前辈。”"
 BA_origin.0108.b:0 "“欢迎回来，前辈。”"

 BA_origin.0109.name:0 "后日谈"
 BA_origin.0109.desc:0 "    约莫一个月之后，夏莱大楼来了一个新的访客。\n    “嘛，有个意想不到的人来了啊，这一个月和星野酱相处得还好吗？她不会也一直特别黏着你吧。”\n    “其实也还好啦，真想不到阿拜多斯能有这么大的变化，今天我是来谢谢老师的。”\n    “唔，你不用谢我，老实说其实都是星野酱自己的努力，她和后辈们一起努力还清了债务，然后又联系上了千年的工程部……我不过只是帮她搭桥引线罢了。”\n    “星野酱自己的变化也很大哦，毕竟以她过去的性格恐怕是不会去找别人合作的，顺便一提，虽然她自己可能没有意识到，但是她似乎对老师的事情格外上心哦~”\n    这么说着，她神秘兮兮地递给我一张卡片。\n    “（小声）那么，就让我这个前辈来小小地帮她一把吧。”“所以啊，老师不要辜负了星野酱哦？”\n    还没等我反应过来，她已经离开了夏莱，留下的卡片上赫然写着“海洋主题婚戒定制”。" 
 BA_origin.0109.a:0 "这都什么和什么啊。"

#### 没包之人（优香就职事件链）
  ###优香事件
 BA_origin.0401.name:0 "255份疲倦"
 BA_origin.0401.desc:0 "	    “哈啊......又是一批专利申请,希望科技复苏所那边不要再搞什么奇怪的东西了......”\n    我坐在学生会长的办公桌前,望着眼前厚厚的一沓申请书直感大脑充血.\n    自从Sensei正式批准了科技复苏区划的建设后,基沃托斯的科研迎来了超光速发展.这当然算是好事,但所谓任何事情都伴随着代价,这些尖端头脑在带来科技革命的同时,也有一些学生在闲暇之余,开始用经费来开发一些奇怪的东西了.\n    基沃托斯就是这么神奇,明明科技已经发展到无需面对面便可以在几分钟内达成线上星球速递的地步,大家却意外默契地保留了使用纸质文件的习惯.\n    本着做好本职工作就无所谓她们的想法,科技复苏所提交的花里胡哨的专利申请我也是睁一只眼闭一只眼,然而最近这类现象越来越普遍了,复苏所的所长日鞠甚至也带头搞起了诡异发明.\n    “唉......下次就该把她们的科研经费扣一点回来......”\n    抱怨归抱怨,今天的工作还是得继续.谁让自己是会长呢,提提神,加油吧,优香."
 BA_origin.0401.a:0 "希望一切顺利."

 BA_origin.0402.name:0 "255份烦燥"
 BA_origin.0402.desc:0 "    “一种基于人力驱动的脚踏式轮椅......这是哪个天才提出的想法......哦日鞠啊,不愧是你......”\n    “一种能够自动给被测量者增加100kg的体重秤......果然是晴出的馊主意,下个月的妖怪MAX自费去吧......”\n    “一种能够在阳光下自动迷彩隐形的衣物......哈??这都什么跟什么啊??” \n\n    一沓文件里有四分之一都是这种一看就非常超现实主义的东西,要不是现在办公室还有其他人,这一堆纸早就在天上飞了.\n    “啊啊啊啊......冷静啊优香,要冷静......”\n    我身心俱疲地趴在桌子上.又是处理这一堆东西,又是要忙各个星球的汇报文书,连Sensei都没法亲自见面只能隔着通讯面板......这也就算了,工作更是积压如山,即便隔着通讯面板,我也很久没有见到Sensei的模样了.\n    这会长谁爱当谁当吧.\n    ......唉,这可是Sensei亲自授权给我的职位啊,我不能辜负他的期望."
 BA_origin.0402.a:0 "再怎么说还得完成工作啊,继续继续."

 BA_origin.0403.name:0 "255份心动"
 BA_origin.0403.desc:0 "    “下一个......一种基于非接触式胞外调整脑电波的特殊频率的催眠装置......驳......”\n    “嗯?等等,催眠?”\n    本想把这张纸扔进粉碎机,标题上催眠一词却让我停下了手.\n    催眠啊......\n    睡梦领域的研究在基沃托斯早已不是什么神秘了.我们的大脑会根据睡眠的深浅程度产生不同频率的脑电波：睡眠越深,频率越低,其中以δ波的频率最低,表示人的深度睡眠阶段.接触式的波长共振技术也以脑电图设备为原型成功研发,但非接触式——即完全以空气为介质,远程操控人体脑电波,同时还要让其在睡眠状态下听从命令的技术......\n    即便是在科技复苏所,这也是诸多学生意图攻克的难题之一.\n    “本技术意图使用一种特殊的气体,经过电磁波在气体粒子中的反复弹射,将其频率稳定到一个固定值,随后散光功能会利用相长与相消干涉抵消其他频率的波长,再通过人体介质与脑电波达成共振......可同时用于光环与非光环单位,建议配合其他医疗设备以达到放松压力的效果......”\n    意外的是,这件成功让提出者青史留名的发明却没有被署名.\n    居然连专利都会有匿名投稿啊......\n    我看着眼前厚厚的一沓文件,只感觉脑袋有些放空.\n    虽然非接触式催眠技术一直是大家研究的热门领域,但以前从来都没有成功过——此后,这一类专利我也是看到一个驳回一个.\n    但这一份......却有一种奇怪的魔力,我感到自己有些不听使唤,想要迫不及待地通过眼前这份专利.或许不只是那份详细的原理解析,还有......\n    我不禁又注意到了“非光环单位”几个大字.\n    ......\n    早濑优香!!你在想什么啊!!\n    那种事不行!!绝对不行!!\n    你可是学生会的会长,是被信任着的......\n    我感觉脑袋有点乱,连忙摇着头,企图把这项专利驳回掉.\n    然而不知为何,事后回过神来,我才发现在最终决策那一栏,不知何时写上了“通过”二字. ""
 BA_origin.0403.a:0 "那就......将错就错吧."

 BA_origin.0404.name:0 "32767份纠结"
 BA_origin.0404.desc:0 "    “感谢学生会会长早濑优香对我们的大力支持,为表感谢,这里是最新版催眠系统的下载链接,还请您过目.祝您度过愉快轻松的一天.”\n    我看着手机屏幕上的蓝色链接出神.\n    这群家伙,居然真的造出来了啊......\n    奇怪的是,即便是在momotalk,对方依然是以匿名的身份找上了我.我其实并不太喜欢这种隐藏身份的对话方式,但既然可以确定是科技复苏所的人员,我也就没必要忧虑太多——诺亚和所长日鞠是这么告诉我的,我也就相信了两位朝夕相处的伙伴.\n    既然对面还煞有介事地送了原版软件,那我也就恭敬不如从命,来试试他的放松效......\n    “啊,忘了告诉您了,因为某些特殊原因,该软件暂时并未通过光环单位的活体研究,因此现在只能对非光环单位生效哦,还请您在使用时注意.”\n    刚准备点开链接的我,突然又收到了这样的一段话.\n\n    ......\n    啊,真是可惜,看来今天是没法休......\n    等下等下!\n    我刚刚是不是看到了什么不得了的东西?\n\n    我连忙甩了甩头集中精神,又定睛把第二段话读了一遍.\n    “现在只能对非光环单位生效......”\n    而现在离我最近的,没有光环的人,那不就是......\n    ......\n    早濑优香,醒醒!!\n    你可不能被那些谣言迷惑!\n    你可是学生会会长,怎么可能轻易被这种事......"
 BA_origin.0404.a:0 "怎么办怎么办怎么办......"

 BA_origin.0405.name:0 "32767份勇气"
 BA_origin.0405.desc:0 "    “早呀,优香~”\n    “!!!”\n    在我还在胡思乱想之际,Sensei的声音突然从门口传来,让我猝不及防吓了一跳.\n    我连忙把手机收了起来,没有让Sensei看到刚刚屏幕上的对话.\n    “啊,啊哈哈......Sensei也早上好啊......”\n    （那个东西......Sensei应该没看见吧......）\n    “说起来,您今天怎么来了......?”\n    “诶?不是前几天优香邀请我来,说是今天要亲自做我的私人小财务官嘛?”\n    “啊,对,对哦......”\n    优香啊优香,你怎么连这件事都能忘啊!!多亏Sensei还这么信任你......\n    “比起那个,今天优香的脸很红哦,是哪里不舒服吗?”\n    “!!!”\n    我下意识摸了摸自己的脸,只感到一阵温热,再加上刚刚的聊天记录还历历在目......\n    “没,没有!您放心吧我现在好得很学生会会长就是要说到做到今天您就交给我吧我一定不留余力做Sensei最贴心的小棉袄的!!!”\n    一番连珠之后,总算是先把Sensei安抚了下来,虽然我刚刚那副样子可能更需要安抚......\n    话说回来,今天可是我为了Sensei能好好休息,主动邀请Sensei来到学生会休息的日子,我可不能让他失望呀.\n    我一边这么想,一边掏出手机准备工作.\n    然而因为方才匆忙收起手机,我解开密码的那一瞬间,熟悉的聊天记录页面映入眼帘.那一行“现在只能对非光环单位生效”的醒目的黑字正在屏幕中间,仿佛有一股神奇的魔力.\n    我吞了口口水,侧过头去看向正在休息的Sensei.他正在离我不远的桌前闭目养神,也就是说——我现在无论做什么,他都不会发现.\n    ......嗯,我只是想让Sensei获得更好的休息而已!Sensei这么过劳的大人,在如何休息方面一定不如我知识丰富吧!嗯!一定是这样!\n    既然如此,那让Sensei好好休息的任务,今天就由我来接下了!\n    我用这样的说辞催眠着自己,随后心一横,按下了那个蓝色链接.\n    短暂下载后,屏幕上出现了安装的进度条,一秒,两秒,三秒......我盯着屏幕上的百分比,时不时撇过头去看着Sensei的动静,每一秒都宛如煎熬.\n    还好,在Sensei起身之前,软件就已经下载好了.那是一个平平无奇的图标,谁能想到普通的外表下竟隐藏着基沃托斯最尖端的科技.\n    “呼......哈......早濑优香,不要紧张,你只是为了让Sensei好好休息的......”\n    我打开软件,调整好了模式,接着便站起了身.\n    “我只是想让Sensei好好休息而已......”\n    而Sensei似乎也听到了我的脚步声.他睁开了眼睛.\n    “诶,优香?有什么......”\n    没等Sensei说完,我便把早已准备好的手机放到了他面前."
 BA_origin.0405.a:0 "“Sen,Sensei!请您盯住屏幕不要动!”"

 BA_origin.0406.name:0 "32767份紧张"
 BA_origin.0406.desc:0 "    空气在此刻凝固,办公室里的两人同样随着空气凝固在原地,就连时间仿佛都定格于此,我紧紧握住手机,生怕自己的一时疏忽导致满盘皆输.\n    拜托了,一定要起效啊......!\n    不知道过了多久,Sensei先于我做出了反应.他先是趔趄了一下,然后迅速后退了几步,宛如大梦初醒.\n    我连忙跑过去,扶住了脚步不稳的Sensei.他有些双眼无神,似乎看起来略显疲惫,但似乎没什么大碍.\n    随后,他只是站在原地,不发一言.\n    胸腔中心脏的跳动声于四周回响,我甚至感觉自己的肺都要炸裂开来.\n    我还是那么做了啊......\n    已经到这一步了,优香,你已经没有回头路了.\n    不管发生了什么......回头再和Sensei好好解释吧.\n    我能感到自己的汗顺着脸颊滑落,自己的瞳孔不肯离开他半秒,甚至就连想要开口的时候,都觉得喉咙堵塞干燥,声音沙哑而细若蚊蝇."
 BA_origin.0406.a:0 "“Sen,Sensei?”"

 BA_origin.0407.name:0 "32676份缄爱"
 BA_origin.0407.desc:0 "    面前的大人顺着我的声音稍稍动了一下,但我不是很确定自己有没有成功.\    “请,请您把您的右手举起来?”\n    他稍微迟疑了一会,然后跟着我的话照做了.\n    “那,您可以,靠近我一点吗?”\n    Sensei又向前走了几步.\n    难道说,真的成功了吗?\n    我被眼前的现状所震惊,丝毫不敢相信这美妙的现实.\n    “如,如果,这真的是现实的话......”\n    这次是我主动走上前去,看着如今任我摆布的Sensei.\n    “您,您可以......抱抱我吗?”\n    “自从我当上了学生会长以后,看似与您在物理上更近了,其实学生会的工作把我压得喘不过气来,每天除了文件就是文件,去过的地方除了办公室就是食堂......”\n    “就连您上交资料,都是直接交给行政官,然后才能给我过目......”\n    “每次我看到您手写的纸张,我总会想到我还在研讨会的时候——真好啊,没有繁杂的工作,没有看似近在眼前实则远在天边的隔阂,有的只是我与您一同立下的约定......” \n    我本想要尽可能保持平静,但不知不觉中,自己的喉咙有一些哽咽.\n    “我,在见不到您的日子里......”\n    “您不知道,我有多想您......”\n    Sensei的拥抱也如约而至.大人的臂弯很温暖,很宽阔,完全容得下最爱他的学生.\n    我再也抑制不住自己的情绪,在Sensei的怀里哭出了声.\n    “Sensei,我爱您,我真的好爱您!!”\n    “但我这样懦弱胆小的人,也只能趁现在向您这样倾诉心意了......”\n    “虽然我知道,在效果结束后,一切都会恢复原样......”\n    “但只有在这个时候,还请您,心里只想着我,怀里只抱着我......只要有这一天我能感到您的温暖,优香就已经很满足,已经很快乐了......”\n    “如果能重来的话......我或许,不会再选择当会长了......”\n    我靠着他的胸口嚎啕大哭,而Sensei温柔地抚摸着我的头.\n    霎那间,似乎有一两滴不属于我的泪流过了我的脸颊.\n    只是我并没有太在意.\n\n    那一天,Sensei只是默默地陪着我.他哪里也没有去."
 BA_origin.0407.a:0 "只是这样,就足够了......"

 BA_origin.0408.name:0 "65545份决心"
 BA_origin.0408.desc:0 "    自那天过去后又过去了几个月.\n    最近我感到自己的精神状态恢复了不少,工作更加高效且耐心,情绪方面也没有那么容易失控了.\n    可能是补充了Sensei能量的缘故吧.\n    明明和自己最喜欢的人只隔了几个走廊而已,我却每天都被锁在办公桌前,宛如隔世.\n    ......\n    想到这里,我又不自觉的心生颤动.\n    果然,我是个没有Sensei就控制不住自己的坏孩子啊.\n    但是,Sensei他,一定会理解的吧?\n    我一边这么想着,一边精心打扮了一下自己：梳的整整齐齐的蓝紫色长发,淡妆粉饰的脸颊,一袭纯白色的衬衫故意解开了最上面的几颗扣子,配上下身展露双腿的黑色短裙——\n    这样的我,有没有显得成熟一点,更能让Sensei喜欢我一点呢?\n    很显然,今天的目的地并不是学生会——为了这一天,我已经准备了太久了.\n    怀着激动而忐忑的心情,我最后一次在镜子面前看了看自己,然后出了门.\n\n    今天的作战计划,是要和Sensei一起享受工作之外的快乐.我已经为这一刻筹划了数个月之久——工作交给各个室长,精心打扮一番换一套气质,以及在那一天提前和Sensei许下今天的约定.\n    还要那句最重要的,“只请您在那一天,心里只想着我,眼里只看着我,怀里只抱着我......”\n    这样,早濑优香就可以心满意足地为Sensei解开催眠,回到日常的工作去了.\n    我们约好了在千年的大楼门前见面,那是我还在研讨会时,我们最经常见面的地方."
 BA_origin.0408.a:0 "少女不会输,少女不能输."
  
 BA_origin.0409.name:0 "65545份安然"
 BA_origin.0409.desc:0 "    一路上并没有太多波澜,大部分学生都没有认出来我,我也顺利来到了千年大楼楼下,或者只是我认为她们没认出来我.\n    Sensei到的比我早一点,已经在等我了.\n    “啊,早上好,优香.”\n    “啊,嗯,那个,Sensei,早上好......”\n    前些个月的场景还历历在目,一想到居然对Sensei做了那种事,我就感到难以抵触的愧疚.\n    不不不,现在可不是愧疚的时候!\n    这可是我策划了好几个月的,和Sensei一起出去玩的秘密作战!愧疚什么的留到后面再说吧!\n    “那,我们走吧,优香.今天有什么计划吗?”\n    Sensei对我伸出了手,他温柔的瞳眸在看着我,他在等待我的回应.\n    我其实并没有什么计划——只要能和Sensei这样度过一整天,那就是我最美好的计划.\n    我有些心里没底,但还是毅然地握住了Sensei的手.大人的手有些粗糙,但也很温暖,能够整个包住我的手.\n    “如果您今天,能在基沃托斯陪我到处转转......”\n    “那就再好不过了呢.”"
 BA_origin.0409.a:0 "请赐予我人生中最幸福的一天吧."


 BA_origin.0410.name:0 "65545份不舍"
 BA_origin.0410.desc:0 "    这一天我其实过得有些飘飘然,和Sensei在一起的喜悦盖过了其他所有的情绪和记忆,我几乎已经记不清今天详细去了哪里,以及做了什么.\n    我只知道,我们从千年开始,一同游历了基沃托斯各大校园的打卡景点.\n    从千年本地的商场,一路经过阿拜多斯附近的水族馆,到达圣三一的教堂,品尝过山海经的美食,感受过百鬼夜行的节日庆典,还有基沃托斯本地的乐园摩天轮......\n    但是没有关系.我和他所珍视的一切,都已经好好地保存到了手机里.\n    昔日用于帮我计算各种概率的计算器手机,今天被那绝对而真挚的,不相信任何不可能概率的感情所占据.\n    要在一天之内转完整个基沃托斯是不可能的——虽然行程匆匆,但有了身边人的陪伴,再短暂的瞬间都是无比的美好.\n\n    最后,我们回到了联邦学生会的楼下.余光扫过天际,天穹已然染红.\n    这美好的一天就要结束了啊......\n    虽然心里有各种不舍......\n    但更多的,还是对自己愿望的满足.\n    啊......真是好久好久都没有体会过的快乐了.那是抛却一切杂念,只和自己的挚爱在一起的,最纯真的快乐."
 BA_origin.0410.a:0 "那也是时候让这一切恢复原状了吧."

 BA_origin.0411.name:0 "65445份诀别"
 BA_origin.0411.desc:0 "    “Sensei......”\n    我轻声地来到Sensei的面前,但却不敢直视他的眼睛.\n    “怎么啦,优香?是还没有尽兴嘛?今天其实还是有时间的哦?”\n    “不不不,今天当然很开心啦!”\n    “只是......”\n    只是早濑优香不能贪心.\n    只是早濑优香不能滥用Sensei的信任.\n    只是早濑优香不能逃避既定的现实.\n    只是早濑优香不能违背与自己的约定.\n    “只是,我想对您说,谢谢,对不起,以及......”\n    “以及,我爱您.”\n    “您或许以后不会再记得今天发生的事......但我会将这一刻铭记于心.”\n    接着,我拿出早已准备好了催眠软件.\n    “这样,早濑优香就能心满意足,去解决基沃托斯的事情啦.”\n\n    随后,Sensei只是在原地愣了一下.\n    我不敢去看Sensei有没有恢复正常.在软件提示催眠解除的那一刻,我鼓起勇气最后一次拥抱着眼前的大人,随后便转过身,头也不回地跑进了学生会.\n\n    脸上莫名有眼泪在流淌.那是我的幸福,还是我的悲伤呢.\n    已经没有人说得清了,就连我自己也不知道.\n    但唯一能确认的事实在我脑中回响,他告诉我："
 BA_origin.0411.a:0 "名为早濑优香的少女,已经别无所求" #这里获得特质温柔地回忆

 BA_origin.0412.name:0 "2147483647份怀念"
 BA_origin.0412.desc:0 "    又是一个月过去.我正在学生会的办公室中处理文件.\n    我能明显感到自己正在逐渐恢复的精神状态：不再有突发的愣神,注意力分散的情况也慢慢变少了.\n    除了科学复苏所那边开始干正事的因素,我想另一个原因,就是了却了自己最大的愿望.\n    现在回想起与Sensei独处的那一天,我的脸上依旧会泛起笑容.\n    仿佛做了一个很长,但是又很温暖的梦.即便在久远的未来回首,依然记得那份最初的感动.\n    只是梦毕竟是梦,人生中有那么一次美妙的小概率事件,即便是贪恋于Sensei的关怀的我,也应该感到知足了.\n    梦总是要醒的.她很美妙,很温柔,很触动——正因如此,她很短暂.\n\n    “砰砰砰”\n    办公室外突然传来了敲门声.\n    “门没锁哦,请进吧.”\n    接着便是开门的吱呀声.\n    “小优香,早安哦~”\n    “Sen,Sen,Sensei??您今天怎么来了?”\n    居然是Sensei的意外到访.和上次不同,自从上个月分别后,我们也没有安排过什么实质性的议程,有的也只是在学生会内三言两语的招呼.如今Sensei却毫无预兆地来访,也算是意外之喜了.\n    “当然是想来看看我们的小优香啦~”\n    “谁,谁是小优香啊......Sensei麻烦您注意场合......”\n    “不过,我当然是欢迎Sensei的到来的.有什么我可以帮您的嘛?”Sensei倒是神秘兮兮地找了个椅子在我旁边坐下,然后故作严肃地开了口.\n    “我接下来说的事,和学生会会长早濑优香的事密切相关,还请听好.”\n    “诶,诶?好,好的!我在听!您说吧!”"
 BA_origin.0412.a:0 "看起来是一些比较严峻的事,我不由得绷紧了神经."

 BA_origin.0413.name:0 "2147483647份暧昧"
 BA_origin.0413.desc:0 "    “那就是,根据这几天学生会各室的活动与数据统计,夏莱这边得出了一个对于优香非常重要的结论.这不仅关系到优香作为会长的职位,甚至连生活都会受到影响.”\n    “什么?我吗?Sensei您别急,我们慢慢来,跟我说说什么事!是基沃托斯财政出问题了?还是军备不足?其他帝国的讯息?先驱者那边的动静?”\n    虽然我劝Sensei不要急,但似乎我才是更急的那个.\n    “很遗憾,这件事远比这些严重得多,请听好——”\n    我甚至紧张到屏住了呼吸.\n    然后在我甚至还没来得及反应的时间里,我只感觉身体一暖——是Sensei把我拥入了他的怀抱,然后——\n    他在我的耳边低语着.\n    “那就是,我都知道了哦,优香.”\n    “诶?您,您知道什么了??”\n    我有点大脑发懵,突如其来的拥抱和故作玄虚的话语让我有点不知所措.\n    “还打算装下去嘛?优香想要催眠我的事,抱着我嚎啕大哭的事,以及一个月前一起远离工作出去玩的事——我可全都知道的哦?”\n    “诶诶诶????”\n    那这不是在说,我在Sensei面前......\n    似乎想要看到我更加害羞的样子,Sensei接着在我耳边说了下去.\n    “优香不乖哦,明明自己喜欢的人就在不远处,为什么却还要用催眠这种方式呢?”\n    “明明是可以调遣其他部门的学生会长,却义无反顾地承担了一切职责,即使是凛同学当初也没有优香这么辛苦自己啊.”\n    “而且,还说着什么,自己这种胆小而懦弱的人......唉,难道我在优香的眼里,居然是那种形象吗?”\n    “呜......这,这个......”\n    我羞红了脸,这些羞耻的瞬间居然都让Sensei捕捉到了......\n    那岂不是代表了......\n    “优香想的没错哦,”Sensei似乎看穿了我的心思,“那个催眠软件,从一开始,就是假的呀.”\n    “居,居然是假的吗?”\n    “嘘,如果想知道更多消息的话,就去问诺亚吧.”\n    Sensei用食指抵住了我的唇.\n    我也渐渐从震惊中缓过神来.\n    此时的情景何等暧昧：Sensei坐在我对面的椅子上,一只手把我按到在自己的椅子上,另一只手抵着我的唇,叫我不要出声.\n    ......不知道为什么,我逐渐开始期待起了后续的发展.\n    “不过,既然现在,办公室只有我们两个人......”\n    “优香,是不是可以稍微坦诚一点了呢?”\n    他移开了唇上的手指,一双勾人心魄的瞳眸就那么看着我."
 BA_origin.0413.a:0 "他在等待我的回应."
 
 BA_origin.0414.name:0 "2147483647份告白"
 BA_origin.0414.desc:0 "    ......我最后选择把心一横,不计后果.自己最喜欢的人就在眼前,即便是诱惑的梦,也让我在最后能尝到一丝甜头吧.\n    “Sensei,我喜欢你!我好爱你!看不到您的每一天,我都在无时无刻的想您!”\n    “既然您说,办公室只有我们两个人......”\n    “那还请拜托您,把目光只集中在我身上......”\n    “可以吗?”\n    话音刚落,我便头脑一热,捧住了Sensei的脸颊.\n    然后,二人唇触.\n    一阵温暖而热情的吻.我不知道我们吻了多久,我只记得唇分时刻,我已几近喘不过气.\n    “小优香,居然这么有气势呢......”\n    Sensei也意犹未尽地舔着嘴唇,似乎这一切都正中他下怀.\n    我呼吸急促,幻想着可能的后续.\n    “等工作结束了,来一趟夏莱吧.”\n    “让小优香来学习一下,属于大人的爱吧.”\n    “所以,我也最喜欢优香了哦.”\n    我只是神情恍惚地点了点头.\n    ......真好啊.\n    我听到了,我最喜欢的人,对我亲口说出的表白."
 BA_origin.0414.a:0 "请让这个梦,再长一点吧......" #获得特质梦境永恒

#### 我也没想好后续，随便写点吧 （日奈就职事件链）
 BA_origin.0201.name:0 "主要话语权的争夺"
 BA_origin.0201.desc:0 "    当格赫娜学园成为学院联邦的主导者时，格赫娜内部依旧存在风纪委和万魔殿两种声音。两方的话语权在等同的情况下势必会出现针对学院联邦政策产生分歧的情况。在这种情况来临之前，格赫娜内部已然开始讨论最终话语权将交给哪一方处理。在敲定最终话语权之前，格赫娜一致认为让日奈暂留总领袖位置，而由伊吕波同学出任万魔殿代表负责协调目前两方的事务。"
 BA_origin.0201.a:0 "基沃托斯将走向何方？"

###########未花事件线
 BA_origin.0301.name:0 "白玉阶上的公主殿下"
 BA_origin.0301.desc:0 "    （在处理今天的工作时,从阿罗娜那里收到了来自学生会总部的留言）\n    "老师!联邦学生会的圣园未花想要您去联邦学生会一趟,最近她的脸色看起来好像不是很好的样子,老师还是过去一趟吧!""
 BA_origin.0301.a:0 "是发生了什么紧急事件吗?"

 BA_origin.0302.desc:0 "    夏莱事务处理完之后,已经接近天黑才来到神圣之塔顶层的联邦学生会办公室.敲门许久没人回应,索性推门直接进入了办公室.办公室内只有背景灯和一旁的全息地图还在工作,昏暗的灯光下勉强能够看到趴在办公桌上的未花,和无力的耷拉在地上的翅膀."
 BA_origin.0302.a:0 "戳戳未花的脸。"
 BA_origin.0302.b:0 "摸摸未花的头。"

 BA_origin.0303.desc:0 "    最先亮起的是未花那引人注目的光环,如星云般缓缓流动粉色光环照亮了眼前睡美人的身影.随之响起的就是未花疲惫感十足的声音.\n    “谁啊……擅自潜入别人房间是很不礼貌的行为哦？”\n    未花揉着惺松的睡眼，想要确认眼前的身影.过了好一会才慌张的发现眼前的人是sensei\n    “欸欸欸欸欸欸欸……？”随着未花的惊叫，检测到房主重新进入活跃状态的中央控制系统打开了主灯.办公桌上的全息投影恢复了未花之前中断的页面.十几个弹窗和屏幕同时出现在办公桌上，突如其来的光线变化刺得两人睁不开眼.好不容易安抚好刚睡醒的未花.总算安定下来的二人开始了既定日程的讨论.\n    “百鬼夜行发来的请求，希望将一颗星球安排为度假星球专供百鬼夜行对外进行传统的旅游业经营.主要不是预算问题，如果是要一整颗星球的话未免有些过于夸张，之前有尝试过批复部分地块给他们，被‘如果不是完整的星球很容易游客失去沉浸感’为由反驳……”\n    “千年那边有新的预算申请，貌似是希望在边境上复刻类似埃里都的堡垒城市.呜……sensei应该跟那边比较熟悉吧,能不能帮我劝劝他们.学生会目前的预算十分紧张啊.这个月不止一次被葵同学唠叨了.”\n    “山海经的走私口岸问题一直没有解决……不管是当地税收还是我们的财政都受到了很大影响.妃咲会长的合作意愿平平,能麻烦sensei联系一下吗……”"
 BA_origin.0303.a:0 "未花，这些问题momotalk也可以直接说的吧。"
 BA_origin.0303.b:0 "未花，这些问题之前我记得我们讨论过的吧。"

 BA_origin.0304.desc:0 "    未花的身体明显停顿了一下.接着心不在焉的说着“是吗是吗……啊哈哈“人家可能忘了啦，最近实在太忙了”这样的话语搪塞着.一边挥舞着洁白的手臂在全息桌面上寻找着可以商谈的文件。"
 BA_origin.0304.a:0 "未花很辛苦吧，毕竟以前从来没有接触过类似的工作。"
 BA_origin.0304.b:0 "我知道的哦，有很多人在暗中作梗反对未花。"

 BA_origin.0305.desc:0 "    一句话像是打开了阀门一样，未花的眼泪落到了裙子上,原本因为多日劳累而凌乱的裙子很快被泪水打湿.见状我让阿罗娜接管了办公室的中控系统，调暗了灯光的同时打开了隔音装置.\n    “未花明明已经很努力了,为什么……为什么她们还是要跟我作对。不是sensei或者各个学院领袖施压的行政命令他们就根本不肯执行.”\n    “好久都没见过渚酱和小圣娅了，整个办公室，这么大，每天都只有我一个人……好冷……”\n    “Sensei……未花真的很累,但是未花不想让大家怀疑sensei的选择,我只是……不想让sensei失望.”"
 BA_origin.0305.a:0 "未花，过来。"
 BA_origin.0305.b:0 "（示意未花把头靠在自己的大腿上）"

 BA_origin.0306.desc:0 "    未花显然是有点惊讶,sensei曾经从来没有主动让自己发生过肢体接触.但还是有些犹豫的躺倒在了沙发上,sensei的手穿过了光环放在了未花的头上.未花踢掉了自己的高跟鞋,往sensei身上又拱了一下."
 BA_origin.0306.a:0 "今天未花就好好休息一下吧。"

 BA_origin.0307.desc:0 "    “sensei,谢谢你,我还记得当时在大圣堂时sensei说的话哦,未花的王子大人.”未花微笑着闭上了眼睛，光环熄灭前留下了最后一句话.\n    “果然我还是个坏孩子呢,又把sensei骗了过来……”"
 BA_origin.0307.a:0 "晚安，公主殿下。"

 BA_origin.0308.name:0 "意外之喜"
 BA_origin.0308.desc:0 "    工程部发来通讯，在清理母星曾属于圣三一的地块时，在别馆废墟中发现了一些毁坏的珠宝和工艺品碎片。经过渚确认为伊甸条约期间未花被烧毁的收藏。工程师部希望能与sensei取得联系商讨这批物品的处理问题。"
 BA_origin.0308.a:0 "那孩子吗……过去看看吧。"

 BA_origin.0309.desc:0 "    “sensei,如您所见,这些东西很可能曾经是未花会长的所有物.因为现在会长和反对者的紧张关系,随意处置这些东西很可能会激化矛盾,所以我们希望听取您的意见.”\n    “让我来说明一下,这些东西时当时在废墟中发现的.经过严谨推算,起码还有相当一部分仍然埋在废墟当中.搜索这些东西的难度很大,毕竟大部分都已经是碎片状态,需要耗费相当的精力.”\n    “不过因为基沃托斯的技术进步,根据这些饰品的碎片还原其在遭遇劫难前一刻的状态完全是可能的.只需要用纳米技术和回溯技术重新建构就好.虽然难度很大,但是这也是工程师部存在的意义.爆炸?完整的恢复这些物品就是能力的证明了,不需要加上爆炸功能.”"
 BA_origin.0309.a:0 "那就麻烦你们了。"

 BA_origin.0310.desc:0 "    “放心包在我们工程师部身上吧,不过下个年度的预算嘛……sensei你也明白的,新技术总是开销比较大.毕竟搜索碎片也是一个精细活,虽然耗时,但如果有科研部门的人来帮助我们就再好不过了.”"
 BA_origin.0310.a:0 "这件事交给夏莱吧。"

 BA_origin.0311.name:0 "如星辰般璀璨，从未离去"
 BA_origin.0311.desc:0 "    “sensei你好,我们已经完成了废墟中的遗物提取,目前正在着手于碎片的恢复工作.”\n    “有一件较为完整的样品不需要用到纳米技术,只需要重新翻新打磨即可,我们已经正在着手准备了.剩下的碎片复原过程可能需要一点时间,不过我们保证一旦完成后,我们就会将复原完毕的东西立刻发送给您.”"
 BA_origin.0311.a:0 "我明白了，你们工作也辛苦了。不过为什么琴里被绑起来嘴还被堵上了？"

 BA_origin.0312.desc:0 "    “这个嘛……科研工作总会有些冲突?”\n    “森赛,欧币许奥索敏一哈藕都发汉（sensei,我必须要说明一下我的发现）”\n    （捂嘴）“好了今天的通讯就到这里,如果有进展我们会再联系您的.”"
 BA_origin.0312.a:0 "？"

 BA_origin.0313.desc:0 "    （关闭通讯后）\n    “你们为什么不让我跟sensei说明?抛开我的讲解欲不谈,你们这样知情不报是欺骗!欺骗!”\n    “有些事情我觉得还是让sensei自己发掘,不对,应该说也算是保护那一位会长的隐私?你什么时候跟真理部那群家伙学坏了.”\n   “虽然咏叶说的我不置可否,不过少女心这种东西就应该好好呵护哦.”"
 BA_origin.0313.a:0 "……"

 BA_origin.0314.name:0 "孤星望月"
 BA_origin.0314.desc:0 "    自从上次之后,和未花就约定好了每周至少去看她一次.从那时起,我帮未花陆陆续续的把很多家具搬到了办公室.联邦学生会长的办公室现在已然变成了办公起居一体的房间,好在办公室足够大,可以分割出足够的空间给不同功能的区域.\n    “哇,sensei你来啦,我今天拜托渚酱买来了很稀有的红茶哦,还有这些蛋糕都是特地准备过的哦.”"
 BA_origin.0314.a:0 "这个时间点不工作真的没问题吗？"
 BA_origin.0314.b:0 "政务都处理完了吗？"

 BA_origin.0315.desc:0 "    “最近有在好好努力哦!为约好了要跟sensei喝茶嘛,在办公的时候突然都有动力了,如果sensei能够呆的更久或者更常来的话说不定我会更努力的哦!”好像意识到了这句话过于直球,话音刚落未花的脸上就染上了红晕，只能把头埋在甜品架后面稍作遮掩.\n    唔……这个时候如果不说些什么的话,尴尬的气氛会一直持续下去吧."
 BA_origin.0315.a:0 "公主大人的房间貌似有些朴素啊"
 BA_origin.0315.b:0 "虽然公务很忙，但是公主大人也要注意身体呀。"

 BA_origin.0316.desc:0 "    “哇哇,sensei你突然间都说什么啊……“未花明显被挑逗的更加害羞了,埋头假装喝茶,却连添茶都忘了,一直发出“刺溜刺溜”的声音.\n    “虽然现在条件好了很多,但是忙的抽不开身.连买一些装饰品的时间都没有……不过也好吧,之前有听别的学生代表议论过,这么痴迷于小装饰什么的,一看就不够稳重的样子……”\n    未花看起来心情有点低落,换做是谁的爱好被人这样贬低心里肯定都不好受吧."
 BA_origin.0316.a:0 "不会哦，反倒是说这些话的人才不够成熟。"
 BA_origin.0316.b:0 "我觉得随意贬低别人喜好的人，也难堪大任。"

 BA_origin.0317.desc:0 "    “谢谢你,sensei。不过经历了那些事,我对这方面也有一点点放下了.我真的很害怕再一次……但是只要不再奢求那么多,也不会再经历失去的痛苦了吧?嗯,我是这么想的呢,哈哈……”\n    “嗯,只要像现在这样就好……像我这样的孩子,还能当上学生会长,还能定期跟sensei开茶话会,未花已经很满足了哦.”\n    未花一直是一个心里藏不住事的孩子,“喜怒形于色”,我想这就是对她最好的形容.哪怕过了这么久,未花仍然会像少女一样把自己心里的所思所想写在量上.刚刚那张可爱小脸的落寂的表情显然在述说着它主人所言乃违心的话语,只是未花接下来的话更超乎我的预料.\n    “sensei也很忙吧……伊甸条约之后都很少来茶会了呢.就连偶尔来圣三一也都是去补课部那边,我都明白的哦,sensei很受大家欢迎呢.我想每个人的幸福都是定量的吧,我以前所受的宠爱,还有在大圣堂的时候,真的那种公主的感觉.我害怕在定量的幸福里,更加贪婪的索取只会招致跟当年一样的结果.所以sensei,未花现在,已经很开心了哦.”"
 BA_origin.0317.a:0 "未花……"

 BA_origin.0318.desc:0 "    “时候不早了呢,sensei.未花要回去工作了哦.未花会按照约定做一个合格的学生会长,sensei也要守约来喝茶呢……”\n    离开联邦学生会后,连偶然在大楼碰上的凛酱都忍不住吐槽未花作为会长这段时间的巨变.我想了想前段时间从工程师部获得的样品,心里筹划着给未花一个小小的惊喜.\n    如果说伊甸条约后那段时间,我对未花有意的疏离是为了尽一个老师应尽的义务,引导她成长为一个更加独立可靠的“大人”.那现在的未花很明显已经比当时要更加成熟了.我曾经的坚持是否还有意义……是否应该继续对我自己撒谎呢?哪怕身体力行,现在应该教导未花的是"
 BA_origin.0318.a:0 "世上虽无不败芳华，但花开堪折直需折，莫待无花空折枝。"
 BA_origin.0318.b:0 "哪怕如星云般虚幻也该认真追寻，莫待相望知不见，终是屡回头。"

 BA_origin.0319.desc:0 "    未花站在落地窗前看着sensei出了联邦学生会的大门,直到身影在人群中不可辨认之后才回到工作桌前.\n    “谢谢你……sensei”……"
 BA_origin.0319.a:0 "……"

 BA_origin.0320.name:0 "星弦高落"
 BA_origin.0320.desc:0 "    为了给未花一个小惊喜,我特地询问了渚未花曾经喜欢的东西.很多都是前基沃托斯时代才售卖的小玩意,在进入太空时代后早就不太时髦了.尤其是未花喜欢的那种精致且古典的装饰,在现在星际大探索的时代更算不上随大流的审美.不过我还是自掏腰包在古董市场买了一些看起来很类似的东西,希望未花会喜欢.\n    虽然是一周一次的茶会时间,但是罕有的未花居然还在会议室开会.直到半小时后才回到学生会长办公室.\n    “久等了,sensei,今天的事情有一点点多.”\n    未花熟练的泡起了茶,可能是刚刚从公务中脱身,显然还有一些身为学生会长和茶会大小姐的架子还没放下."
 BA_origin.0320.a:0 "未花越来越熟练了呢，不过这种时候我还是希望未花更做自己一点。"
 BA_origin.0320.b:0 "未花辛苦了，当初的约定看来遵守的很好呢。"

 BA_origin.0321.desc:0 "    “是吗是吗!sensei你不是在故意安慰我吧!虽然sensei这么说不管是真的假的我都很开心啦,欸嘿嘿……”\n    不愧是未花，一秒破功。\n    “sensei可以再夸一夸你能干的公主大人哦!我可是有在好好成长的!之前sensei刚推举我来到这个位置的时候,我真的感觉很无助呢.”未花顿了一顿,脸稍微有些发红.\n    “而且还做了那么失态的事……”"
 BA_origin.0321.a:0 "为了犒赏一下我听话的公主大人，我今天带了一些小礼品过来哦。"
 BA_origin.0321.b:0 "为了补偿一下公主大人牺牲的个人时间，我带了一些小礼物来哦。"

 BA_origin.0322.desc:0 "    “这些是?”未花还是没有变,在看到从布包里拿出来的饰品以后脸上少女般的笑容根本遮不住.\n    “sensei,这些都是你从古董市场淘来的吗,谢谢你.一定是渚酱告诉你的吧,只有她才能这么精确的切到我的喜好呢.”\n    第一次见到未花的时候,我就觉得这个女孩子眼中似乎能看到星辰摇曳.在这些珠宝的反光和映衬下,那双眼睛更加迷人.\n    “只是,这些东西,我真的能收下吗……我只是做了份内的事情,没有忘记跟sensei的约定而已哦.这样会不会太贵重了呀哈哈……就好像定情信物什么的一样嘛.”"
 BA_origin.0322.a:0 "算是我个人的心意哦，不是什么奖励什么的。"
 BA_origin.0322.b:0 "未花能开心就好，也要学会收下自己应得的。"

 BA_origin.0323.desc:0 "    “个人的心意什么的……sensei你说这种话很容易让人害羞的啦。”未花继续翻看着我带来的饰品,突然如雷劈般定在原地.我喊了她两下都没回应于是凑过去看了看,未花手上的是一个设计精美的蓝宝石戒指,颜色浓度和切工来看不太像是少女会喜欢的东西.但这确实就是工程部发给来的修复完成的第一件样品,我把它混在其他装饰品中想看看未花的反应.如果失而复得的饰品反而让她想起了曾经的不好经历,我也该叫停剩下的修复工作,改为从外采购新的饰品."
 BA_origin.0323.a:0 "未花，这个是……"

 BA_origin.0324.desc:0 "    “嗯,我知道的哦,这个跟我以前的一个收藏很像呢.”未花打断了我的话,脸上又浮现出了笑容.\n    “让我想起了以前的一些事呢,不过都过去了嘛.正如我之前说的,现在的日子,我已经很知足了呢.”\n    见我放下一口气,未花接着说道：“果然还是这种古典精致的设计永不过时呢,现在的东西都太浮躁了……”\n    接着就被未花拉着科普了一大堆古典设计和珠宝美学的知识，圣三一大小姐果然名不虚传……"
 BA_origin.0324.a:0 "……"

 BA_origin.0325.desc:0 "    是夜,\n    “明明……明明我已经放下了,明明我已经知足了,为什么还要提醒我?”\n    未花在自己的床上辗转反侧,脸颊上未干的泪痕在月光的照耀下显得更加令人可怜.\n    “为什么……sensei,你还要这样捉弄我……未花明明已经接受了现实,为什么……未花已经不再是那个会相信童话故事的小女孩了,但是为什么……”“温柔的星辰啊,请收起你们光芒,离我这个罪人远些吧……”\n    少女手中戒指的内环上刻着一串古老的文字:\n          §_“Fatum caeleste arbitrium\n          ad honorabilem principem”§!\n    在迈入星际时代的基沃托斯,只有茶会这样的大小姐中的翘楚,和类似古关优的学者,恐怕才能解读这门古老且优雅的语言.\n          §_“星天所定之命运-献给我敬爱的王子大人”§!"
 BA_origin.0325.a:0 "……"

 BA_origin.0326.name:0 "于天边摇曳的梦幻星光"
 BA_origin.0326.desc:0 "    “您传过来的照片我看过了,本来我也被叮嘱对这件事情保密的,但是如果sensei您已经有所察觉的话,我想如实回答并算泄密,反而是诚实这一高尚品质的体现.”全息影像上的渚喝了一口茶,缓缓说道.\n    “正如您所猜想的那般,是的.未花准备的东西就是那个目的,您发给我的那份复原的项链,和您之前拿到的戒指,确实是男女配套的.”圣娅显然是被渚喊来茶会社团中心的,平时的圣娅都在旧圣三一保留地的花园别墅内休息.不过在听闻谈话内容之后,圣娅显然觉得不虚此行.\n    （圣娅似乎试图说些什么，但是你什么也听不到）\n    “如果我的直觉没错的话,未花沉寂已久的心估计又被您启封了吧.作为大人,可要负起责任哦.”"
 BA_origin.0326.a:0 "曾经我怕过快的发展让她无法自立，只是没想到，到了今天这个地步。"

 BA_origin.0327.desc:0 "    “sensei你当我看不出来吗,”圣娅笑了笑,然后掏出了MP4开始播放,这下你能听到了.“可能渚酱当时还被蒙在鼓里吧,不过我的直觉告诉我你们两个人的命运之线早已纠缠在了一起.在我还有未来视的时候,我学会的一项最重要的只是就是不要企图强行逆天改命.”"
 BA_origin.0327.a:0 "我觉得在我还没来圣三一就劝我放弃跟色彩对抗的人不太有资格说这个话。"

 BA_origin.0328.desc:0 "    “……反正这次不是那么严重的事,我言尽于此,sensei您何苦跟自己作对呢?”\n    圣娅喝茶.jpg\n    （圣娅播放了茶真好喝.mp3）\n    “总之,情况就是这样,如果sensei您仍然需要我们的帮助的话,可以随时联系我们.身为未花的朋友,我们定会对挚友的幸福鼎力相助.”渚的脸上还是一贯的端庄微笑.\n    “即使是在今天,如果您做好准备,就放手去做吧.”"
 BA_origin.0328.a:0 "我会的。"

 BA_origin.0329.name:0 "赎罪少女的双眼仍能映见星辰璀璨"
 BA_origin.0329.desc:0 "    为了这一天,我特地把下午的茶会时间以公务繁忙接口推脱到了晚饭时间.还联系枫香和晴奈联手准备了豪华晚宴,联邦学生会的各位也帮忙把神圣之塔顶层的露台清理了出来当临时餐厅.我跟她们也坦白了这样的目的,并且拜托大家保密.虽然在一开始差点吃了枫香的菜刀,不过在经过了一段时间的缓冲以后大家还是忙碌起来帮忙准备起了晚餐.\n    “既然事已至此,那sensei的幸福就是我的幸福.请放心吧，这顿饭我会穷尽毕生功力的.”"
 BA_origin.0329.a:0 "总之万事拜托了！"

 BA_origin.0330.desc:0 "    晚饭时间,未花如期而至.\n    “欸,sensei,你不是说今天公务繁忙才把茶会推成晚饭吗,怎么你现在在这里等我?……还有你那身打扮到底是怎么了啦,刚从星海一言堂回来?为什么会这么正式啊.”未花显然没有意识到将要发生的事情,直到同居多年以后未花还是时不时会抱怨那天没有提前通知她换一套华丽的衣服和化妆打扮一下."
 BA_origin.0330.a:0 "都是为了我的公主大人呀,难得有空吃个晚饭肯定要留下美好回忆的嘛."

 BA_origin.0331.desc:0 "    “讨厌……sensei你这种说话方式真的很容易引火烧身的哦,圣三一的大家还相对端庄,要是格黑娜那群家伙可不知道会发生什么呢.”未花羞得通红的脸跟她嘴上的话丝毫不匹配,察觉到这点的未花慌张的拉开椅子准备入坐.\n    晚饭时间平平无奇,基本就是关于时事政务的讨论.\n    餐后,晴奈抱着一瓶葡萄酒出现在餐桌前.\n    “这是我的收藏之一,前基沃托斯时代的遗物.跟现在那些有机合成的葡萄酒可以不一样哦,不过既然sensei肯包下美食研究会一整年的外星高端食材供给,我也是可以做出一点牺牲的.”\n    “欸……sensei.喝酒什么的……真的没问题吗?不管怎么说未花还是个学生哦.”未花的声音略带一些迟疑."
 BA_origin.0331.a:0 "未花在我心里已经是一个独当一面的大人了哦，这段时间未花的成长和政绩可以非常清楚的证明这一点."

 BA_origin.0332.desc:0 "    “sensei真的是……不至于用这种方法来表扬我把,简简单单的称赞几句我就很高兴了.而且啊,万一我喝醉了,我可不保证会做出什么事情哦……我的力气sensei也是见识过的吧.”未花笑吟吟的端起酒杯.\n    “原来……这就是大人的味道吗，苦涩，辛酸……再带着一点点甘甜……”\n    酒过三巡之后,未花的脸上已经红霞漫天,清澈的眼神也开始迷离了起来.在未花端起餐后甜品的时候,我的内心告诉我:是时候了."
 BA_origin.0332.a:0 "未花，奶油沾到脸上了哦."

 BA_origin.0333.desc:0 "    我掏出餐巾走过去凑近擦掉了未花脸上的奶油,毫无心里防备的未花显然被这一亲昵举动吓了一跳.\n    “欸欸欸欸……sensei我自己擦也可以了……我也是个大人了,不是那种需要别人宠溺的小公主啦.”\n    未花慌张的闭上了眼睛,但是手却没有将我推开,如果未花不想的话,我觉得我无论如何都不可能近的了她的身的.想明白了这一点,我更像吃了一颗定心丸."
 BA_origin.0333.a:0 "眼睛不要睁开哦,刚才乱动把奶油沾的到处都是了,如果不想变成花猫就先别动。"

 BA_origin.0334.desc:0 "    我跟未花有多久长时间没有这么近距离接触过了呢,一股淡淡的香气袭来,把绕道未花身后的我熏的有些迷糊.夜来香,薰衣草,百合,还有一部分柑橘的味道,看来未花虽然公务繁忙,但少女本性让她仍然不忘保养皮肤.\n    我掏出项链,迅速系在了未花颈间.\n    “sensei!这是什么东西?”冰凉的触感让未花的身体颤抖了一下.“这是,sensei为什么会有这个项链,这明明是……”未花睁开双眼,脖子上的项链让她呆愣了一下,声音也颤抖了起来.\n    “为……为什么，这……sensei……又是二手市场淘来吗……这个项链……不对……到底是……为什么……”"
 BA_origin.0334.a:0 "嗯，未花，可以请你当我一辈子的公主殿下吗。"

 BA_origin.0335.desc:0 "    “哇哦……”未花的表情和神态让我突然有了在大圣堂地底的错觉,此时此刻,恰如彼时彼刻.\n    “是……是我想的那样吗?”未花小心翼翼的发问，两行清泪已经顺着眼眶滴落在了餐盘上.\n    “我这样的坏孩子,也还有机会,看到这一天吗.”"
 BA_origin.0335.a:0 "对不起……之前是我自己在骗自己，连累未花一起煎熬了这么久，这也是我作为老师，作为恋人，作为守护公主的王子的失职。"
 BA_origin.0335.b:0 "从今天开始，能允许我陪伴未花公主踏上征服群星的道路吗？"

 BA_origin.0336.desc:0 "    “我……我愿意!”未花毫无犹豫的答应了我的请求，随后倒在我的怀里泣不成声.\n    “sensei!……sensei大坏蛋,明明我都已经不抱希望了.明明我已经想好了一辈子跟sensei当同事,明明我已经很知足了!为什么sensei拖到现在才说这些,明明我从大圣堂的那天就已经离不开sensei了.”\n    “你知道这段时间我都是怎么想的吗!我每天晚上在床上想sensei说的公主大人是不是只是在哄小孩,是sensei把我拉出了那万劫不复的困境,但是你撒手离开圣三一的那段时间,sensei你知道我有多想你吗!”\n    “为了惩罚你,一辈子都不许离开你的公主殿下哦!一辈子都不允许!以后要好好陪在未花身边,好好补偿这段时间sensei做的坏事!”\n    “sensei,你怎么……不说话了?”"
 BA_origin.0336.a:0 "未花，抱轻点……我喘不上气了……"

 BA_origin.0337.desc:0 "    未花“呀!”地叫了一声,松开了捆住我的双手.等我缓过神的时候,未花已经托人带来了那枚戒指,一同随行的还有今天来到学生会的各位.\n    “sensei以后要跟我学做饭咯,可不能让公主下厨啊.”\n    “啊啦啦,美妙的爱情才是最上等的美食呢.”\n    “sensei你要吃明太子薯片吗,今天这么大喜的日子特别允许你吃一口哦.”\n    “婚礼的预算,啊……学生会的账面赤字回头我再想办法吧.”\n    “未花,sensei,我和圣娅都很高兴看到今天这一幕,这也算是了却了我们的一桩心愿.”\n    “谢谢,谢谢大家,未花今天,很开心.”\n    “哦对了,sensei的戒指,我来帮sensei戴上吧,以后我们再也不会分开了,好吗?”"
 BA_origin.0337.a:0 "嗯，我发誓作为王子守护未花直到永远。"


######     群友彩蛋     ######
#### 彩蛋事件链-Azusa
 BA_Easter_egg.0002.title:0 "奇怪的照片"
 BA_Easter_egg.0002.desc:0 "今天，[Root.GetName]的一张白丝照突然出现在了[Root.owner.GetName]的所有电子设备的屏幕上。但在仅仅一秒之内，这张照片就消失了，仅仅留下了一条神秘的信息：\n“§YPeek§!”"
 BA_Easter_egg.0002.tip:0 "从照片中获得：§G+1§!£unity£"
 BA_Easter_egg.0002.a:0 "查一查照片和信息的来源。"
 BA_Easter_egg.0002.b:0 "不过是个恶作剧而已，算了。"

 BA_Easter_egg.0003.title:0 "EasterEgg：MiAzusa"
 BA_Easter_egg.0003.desc:0 "为时不久，发送白丝照的神秘人再次开始了行动。我们又一次接收到了[From.GetName]的白丝照，照片与上次同样的光速消失，并且再次留下了同样的神秘信息：\n“§YPeek§!” 与上次不同的是，我们捕获了发送者的ID，并且发现从一闪而过的照片中发现照片中实际上并不是[From.GetName]，而是发送者本人。"
 BA_Easter_egg.0003.tip:0 "从照片中获得：§G+2§!£unity£"
 BA_Easter_egg.0003.a:0 "把那个“反导系统”部署好，一定要把照片留下。"
 BA_Easter_egg.0003.b:0 "挖出IP地址，抓住他，让他穿黑丝。"

 BA_Easter_egg.0004.title:0 "EasterEgg：MiAzusa"
 BA_Easter_egg.0004.desc:0 "我们成功的抓住了照片的发送者，并且以骇入超光速通讯系统罪将其起诉。仁爱的联邦学生会判处其§G必须定期发送足量的照片§!给全基沃托斯观赏。"
 BA_Easter_egg.0004.a:0 "好好好，爱看，多发。"
 BA_Easter_egg.0004.b:0 "白丝照要发，黑丝照也要发，这才称得上健全。"

#### 彩蛋事件链-鞋垫#1
 BA_Easter_egg.0011.title:0 "挖矿风波"
 BA_Easter_egg.0011.desc:0 "最近在基沃托斯内掀起了相当热烈的挖矿热潮。\n几个月来，无数的芯片被组装为GPU，流水线般送到专用的矿场中，用于挖取一种加密数字货币。\n虽然货币的算法非常精妙，安全性和可靠性都很有保障，但货币交易毕竟是前超光速时代的落后经济方式。而且挖矿运算过程要白白消耗大量的能量，经过高负荷运作的元件用作其他用途也很有隐患。\n总之是时候停下这场闹剧了，在调停室的强烈抗议下，联邦学生会已经将取缔计划提上日程。"
 BA_Easter_egg.0011.a:0 "肯定是有什么人在幕后指使着这一切。"
 BA_Easter_egg.0011.a.tip:0 "早该管管了。"
 BA_Easter_egg.0011.b:0 "这种泡沫风潮来的快，去的也快，稍安勿躁。"
 BA_Easter_egg.0011.b.tip:0 "不过是个恶作剧而已，算了。"

 BA_Easter_egg.0012.title:0 "挖矿风波"
 BA_Easter_egg.0012.desc:0 "调停室首先向一些地下矿场派遣了一些线人，从目前火爆的加密币种入手，一点点分析它们背后的货币流、算法和玩家们。随着调查的渐渐深入，一个公司的名字也慢慢浮现，显露出它在其中的巨大牵扯：§E奈芙蒂斯§!。"
 BA_Easter_egg.0012.a:0 "……先和当事人谈一谈吧。"

 BA_Easter_egg.0013.title:0 "挖矿风波"
 BA_Easter_egg.0013.desc:0 "调停室组织了一场联邦学生会和奈芙蒂斯的当事人的秘密谈话。结果令人大跌眼镜：奈芙蒂斯使用了一些手段来收拢目前数字币网络的算力资源，取得了不少用于挖矿的硬件，并且将这些设备改用于AI。据奈芙蒂斯的代表§Y十六夜野宫§!所说，此举的目的是为了消灭“死灰复燃的货币经济”。确认双方目的一致之后，野宫代表奈芙蒂斯表示，她们会继续处理这些被不当使用的硬件，并且目前需要联邦学生会提供一些援助，作为交换，奈芙蒂斯可以提供一个名字给联邦学生会。"
 BA_Easter_egg.0013.a:0 "名字……"

 BA_Easter_egg.0014.title:0 "挖矿事件的幕后"
 BA_Easter_egg.0014.desc:0 "根据野宫提供的线索，调停室十分轻松的拿下了这个人。此人名为§Y白石透§!，虽然名不见经传，目前绝大多数的货币算法均由此人设计，并且通过兜售计划和分红取得了可观的收入。更惊人的是，这些收入基本都被用来购买生活物资以囤积，截至被抓获之时，此人累计订购的物资足够上万人用一整年。"
 BA_Easter_egg.0014.a:0 "虽然不是很明白你在干什么，这场闹剧也该落下帷幕了。"

 BA_Easter_egg.0015.title:0 "挖矿事件的幕后"
 BA_Easter_egg.0015.desc:0 "随着计划提供者落网，虚拟货币交易市场渐渐萎缩，调停室趁机全面出击，扫清了全部的供应者。至此挖矿风波告一段落。"
 BA_Easter_egg.0015.a:0 "虚~拟~货~币~快~远~离~"

######     其他彩蛋     ######
#### 彩蛋遗址-超天酱
 BA_Easter_egg_Angel_arc_site:0 "后现代互联网遗迹"
 BA_Easter_egg_Angel_arc_site_desc:0 "这是一颗屏障星球。与我们见过的屏障不同，这颗星球的屏障可以穿过，屏障之下的智慧生物，被记载为“§_[[未知]§!”的物种们仍然在进行着他们的生活。在这颗星球发现之初，我们曾经采取一些手段避免被其中的生物观测到，但很快发现这是没有必要的徒劳：就像是透过屏幕观看视频录像，又仿佛置身于全息投影之中一般，无论我们采取什么行动，都似乎对星球中的§_[[未知]§!们造不成任何影响。"
 BA_Easter_egg_Angel_arc_site_title_RAID01:0 "无尽宇宙"
 BA_Easter_egg_Angel_arc_site_desc_RAID01:0 ""
 BA_Easter_egg_Angel_arc_site_option_RAID01:0 ""
 BA_Easter_egg_Angel_arc_site_title_RAID02:0 "无尽宇宙"
 BA_Easter_egg_Angel_arc_site_desc_RAID02:0 ""
 BA_Easter_egg_Angel_arc_site_option_RAID02:0 ""
 BA_Easter_egg_Angel_arc_site_title_RAID03:0 "天使飞越那无尽的宇宙"
 BA_Easter_egg_Angel_arc_site_desc_RAID03:0 ""
 BA_Easter_egg_Angel_arc_site_option_RAID03:0 "《谢谢你，互联网生活很开心》"
 BA_Easter_egg_Angel_arc_site_title_RAID04:0 "THE INTERNET ANGEL be INVOKED"
